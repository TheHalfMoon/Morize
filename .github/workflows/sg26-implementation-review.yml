name: SG-000026 implementation qualification

on:
  push:
    branches:
      - automation/sg-000026-implementation-review
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Qualify exact SG-000026 implementation head
        shell: bash
        env:
          BASE_MAIN: 404f46f34ab168c0b2b391784c553f58a93ae9df
          IMPL_HEAD: f6f574266518fd9c77abc433de4922be18b660be
          SPEC_REVISION: sha256:af72b5d0c6757c4051f3cb7dc7c2e3de49cdcda77b6c863d1ad1e07a2d1acc1d
          WORKPACKET_DIGEST: sha256:8e51c05fde9d22dd024745a7d482850727dca22f7fcd64b283b97a2656717d3d
          WORKPACKET_FILE_SHA256: 83578cf8a0ce3b463cfaeab55d973071ea2481ce6c2f43bd17a5b0aa902e2ead
          WORKPACKET_ARTIFACT_SHA256: 1ac52a905e308210e8b2b9d6011e016f63e97b182ee9aa44412dd2bce8b38abc
          WORKPACKET_RUN: "35559420381"
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main impl/sg-000026-action-set-version-v2 --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/impl/sg-000026-action-set-version-v2)" = "$IMPL_HEAD"
          git checkout --detach "$IMPL_HEAD"
          test "$(git rev-parse HEAD)" = "$IMPL_HEAD"
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg26-check.json
          specgrain prove SG-000018 . --json > /tmp/sg26-p18.json

          python - <<'PY'
          import json
          import os
          import subprocess
          from specgrain import load_project

          check = json.load(open('/tmp/sg26-check.json'))
          assert check['valid'] is True and check['issues'] == [], check

          project = load_project('.')
          node = next(n for n in project.specs if n.id == 'SG-000026')
          assert node.state == 'GRAIN', node.state
          assert node.revision_digest == os.environ['SPEC_REVISION'], node.revision_digest
          assert tuple(sorted(node.change_surface)) == tuple(sorted([
              'crates/morize-core/src/decision.rs',
              'crates/morize-core/src/lib.rs',
          ])), node.change_surface

          proof = json.load(open('/tmp/sg26-p18.json'))
          assert proof['verified'] is True, proof
          assert proof['latest_record_digest'] == 'sha256:6ed74d50664d885d932b0859fa4acded3826a8a67840afc992d277b0027f6053', proof
          latest = proof['records'][-1]['report']
          assert latest['spec_revision'] == 'sha256:9a8926e557a54ae9f3eed4218a43fd4e14c8aac5f9320f70a1a9b008d4c45e7b', latest
          assert latest['implementation_revision'] == '78c6bda86906a84e9511edd7e19e303cfeb53f4a', latest
          assert latest['issues'] == [], latest
          subprocess.run([
              'git', 'merge-base', '--is-ancestor',
              latest['implementation_revision'], os.environ['BASE_MAIN'],
          ], check=True)

          print('SPEC_CHECK=PASS')
          print('SG000018_PREREQUISITE=PASS')
          print('SG000026_SPEC_REVISION=' + node.revision_digest)
          print('WORKPACKET_BINDING=' + os.environ['WORKPACKET_DIGEST'])
          print('WORKPACKET_RUN=' + os.environ['WORKPACKET_RUN'])
          PY

          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sort | tr '\n' ' ')" = "crates/morize-core/src/decision.rs crates/morize-core/src/lib.rs "
          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | wc -l)" -eq 2
          test -z "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" -- Cargo.toml Cargo.lock '*/Cargo.toml')"
          git diff --check "$BASE_MAIN...$IMPL_HEAD"

          DIFF_SHA256="$(git diff "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          export DIFF_SHA256 FILE_LIST_SHA256

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline
          cargo clippy --workspace --all-targets --offline -- -D warnings
          cargo test --workspace --all-targets --offline 2>&1 | tee /tmp/sg26-tests.txt

          python - <<'PY'
          import re

          text = open('/tmp/sg26-tests.txt').read()
          counts = [int(x) for x in re.findall(r'test result: ok\. (\d+) passed;', text)]
          assert counts, counts
          total = sum(counts)
          assert total == 41, (counts, total)
          print('EXACT_HEAD_TESTS_PASSED=41')
          PY

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg26-diffcipline.json 2>/tmp/sg26-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg26-diffcipline.json | awk '{print $1}')"
          export DIFFCIPLINE_SHA256

          python - <<'PY'
          import json

          lines = [line for line in open('/tmp/sg26-diffcipline.json') if line.strip()]
          result = json.loads(lines[-1])
          assert result['verdict'] == 'PASS', result
          assert result['changed_files'] == 2, result
          assert result['scope_violations'] == [], result
          assert all(item['state'] == 'PASS' for item in result['verification']), result
          print('DIFFCIPLINE=PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview             --format json             --from "$BASE_MAIN"             --to "$IMPL_HEAD"             > /tmp/sg26-ocr-preview.json

          python - <<'PY'
          import json
          import subprocess

          preview = json.load(open('/tmp/sg26-ocr-preview.json'))
          assert preview['total_files'] == 2, preview
          assert preview['reviewable_count'] == 2, preview
          assert preview['excluded_count'] == 0, preview
          paths = sorted(item['path'] for item in preview['reviewable_files'])
          assert paths == [
              'crates/morize-core/src/decision.rs',
              'crates/morize-core/src/lib.rs',
          ], paths
          with open('/tmp/sg26-ocr-rules.json', 'w') as output:
              subprocess.run([
                  '/tmp/ocr-bin', 'delegate', 'rule', '--format', 'json', *paths
              ], check=True, stdout=output)
          groups = json.load(open('/tmp/sg26-ocr-rules.json'))['groups']
          accounted = sorted(path for group in groups for path in group['files'])
          assert accounted == paths, accounted
          print('ALIBABA_ACCOUNTING=2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          from pathlib import Path
          from gradio_client import Client

          spec = Path('.specgrain/specs/SG-000026.json').read_text()
          diff = subprocess.check_output([
              'git', 'diff', '--unified=80',
              os.environ['BASE_MAIN'] + '...' + os.environ['IMPL_HEAD'],
              '--',
              'crates/morize-core/src/decision.rs',
              'crates/morize-core/src/lib.rs',
          ], text=True)

          prompt = '\n'.join([
              'Independent semantic IMPLEMENTATION review of Morize SG-000026. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={os.environ["IMPL_HEAD"]}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={os.environ["SPEC_REVISION"]}',
              f'WORKPACKET_DIGEST={os.environ["WORKPACKET_DIGEST"]}',
              f'WORKPACKET_FILE_SHA256={os.environ["WORKPACKET_FILE_SHA256"]}',
              f'WORKPACKET_ARTIFACT_SHA256={os.environ["WORKPACKET_ARTIFACT_SHA256"]}',
              f'WORKPACKET_RUN={os.environ["WORKPACKET_RUN"]}',
              f'DIFF_SHA256={os.environ["DIFF_SHA256"]}',
              f'FILE_LIST_SHA256={os.environ["FILE_LIST_SHA256"]}',
              f'DIFFCIPLINE_SHA256={os.environ["DIFFCIPLINE_SHA256"]}',
              'Exact-head cargo verification: fmt/check/clippy PASS; tests 41/41 PASS.',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              '',
              'Review goals:',
              '1. MemoryActionSetVersion is public, non-exhaustive, and has exactly one current variant V1.',
              '2. V1 is semantically documented and tested as identifying exactly the existing Store, Update, Merge, Supersede, Contradict, Expire, Forget, Redact, Quarantine, Ignore, and RequireReview MemoryAction vocabulary, with no added or renamed action.',
              '3. MemoryActionSetVersion derives only Clone, Copy, Debug, PartialEq, Eq, and Hash and introduces no ordering contract.',
              '4. No numeric repr/discriminant contract, parser, Display/FromStr, serde, wire representation, persistence encoding, migration, schema field, API, MCP, or dependency is introduced.',
              '5. The version value grants no authorization, target selection, threshold, policy decision, mutation authority, execution, storage behavior, or side effect.',
              '6. No DecisionEnvelope, candidate/action score, confidence, abstention, reason code, evidence reference, engine identity, policy revision, replay, or domain-record behavior is introduced.',
              '7. Exact implementation surface is decision.rs plus lib.rs only; Cargo manifests and Cargo.lock remain unchanged.',
              '8. SG-000018 proof identity remains exact and the immutable SG-000026 WorkPacket was exported before this execution.',
              '9. The implementation is minimal, dependency-free, and consistent with the Grain acceptance and explicit scope exclusions.',
              '',
              'SG-000026 contract:',
              spec,
              '',
              'Exact implementation diff:',
              diff,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              os.environ['IMPL_HEAD'],
              'REVIEW_KIND',
              'SG-000026_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.',
          ])

          Path('/tmp/sg26-review-prompt.txt').write_text(prompt)
          client = Client('CohereLabs/North-Mini-Code-1.0', verbose=False)
          final = ''
          for attempt in range(1, 4):
              raw = client.predict(prompt, 'Rust', '[]', '{}', api_name='/chat')
              obj = json.loads(raw) if isinstance(raw, str) else raw
              content = ''
              for message in obj.get('history', []) if isinstance(obj, dict) else []:
                  if message.get('role') == 'assistant':
                      content = message.get('content', '')
              candidate = content.split('</think>', 1)[-1].strip() if '</think>' in content else content.strip()
              structured = (
                  f'REVIEW_HEAD\n{os.environ["IMPL_HEAD"]}' in candidate
                  and 'REVIEW_KIND\nSG-000026_IMPLEMENTATION' in candidate
              )
              if structured:
                  final = candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt < 3:
                  time.sleep(10)

          if not final:
              raise SystemExit('independent implementation reviewer returned no structured review after 3 attempts')

          Path('/tmp/sg26-review-final.txt').write_text(final + '\n')
          print('INDEPENDENT_REVIEW_BEGIN')
          print(final)
          print('INDEPENDENT_REVIEW_END')

          checks = [
              f'REVIEW_HEAD\n{os.environ["IMPL_HEAD"]}',
              'REVIEW_KIND\nSG-000026_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS\n- NONE',
              'FINAL_GATE = PASS',
          ]
          if not all(item in final for item in checks):
              raise SystemExit('independent semantic implementation review produced a non-PASS result')

          summary = {
              'base_main': os.environ['BASE_MAIN'],
              'implementation_head': os.environ['IMPL_HEAD'],
              'spec_revision': os.environ['SPEC_REVISION'],
              'workpacket_digest': os.environ['WORKPACKET_DIGEST'],
              'workpacket_file_sha256': os.environ['WORKPACKET_FILE_SHA256'],
              'workpacket_artifact_sha256': os.environ['WORKPACKET_ARTIFACT_SHA256'],
              'workpacket_run': os.environ['WORKPACKET_RUN'],
              'diff_sha256': os.environ['DIFF_SHA256'],
              'file_list_sha256': os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256': os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256': hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256': hashlib.sha256((final + '\n').encode()).hexdigest(),
              'tests_passed': 41,
              'alibaba_reviewable_files': 2,
              'alibaba_excluded_files': 0,
              'final_gate': 'PASS',
          }
          Path('/tmp/sg26-qualification-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('QUALIFICATION_SUMMARY_BEGIN')
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('QUALIFICATION_SUMMARY_END')
          PY

          test -z "$(git status --porcelain)"

      - name: Upload exact-head qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sg-000026-implementation-qualification
          path: |
            /tmp/sg26-check.json
            /tmp/sg26-p18.json
            /tmp/sg26-tests.txt
            /tmp/sg26-diffcipline.json
            /tmp/sg26-diffcipline.err
            /tmp/sg26-ocr-preview.json
            /tmp/sg26-ocr-rules.json
            /tmp/sg26-review-prompt.txt
            /tmp/sg26-review-final.txt
            /tmp/sg26-qualification-summary.json
          if-no-files-found: error
          retention-days: 30
