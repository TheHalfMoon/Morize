name: sg21-authoring

on:
  push:
    branches:
      - automation/sg-000021-authoring

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Author and qualify SG-000021 planning branch
        shell: bash
        env:
          BASE_MAIN: f79e1bd91aa39760d283eb326a17a0ea08e0eeba
          PLAN_BRANCH: plan/sg-000021-mutation-terminal-state
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          if git ls-remote --exit-code origin "refs/heads/$PLAN_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $PLAN_BRANCH" >&2
            exit 2
          fi

          git switch -C "$PLAN_BRANCH" origin/main
          git config user.name "Gocceri"
          git config user.email "azialshehri@gmail.com"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg21-base-check.json
          specgrain prove --json SG-000011 . > /tmp/sg21-sg11-proof.json
          python - <<'PY'
          import json, os, subprocess
          check=json.load(open('/tmp/sg21-base-check.json'))
          proof=json.load(open('/tmp/sg21-sg11-proof.json'))
          assert check['valid'] is True and check['issues']==[]
          assert proof['verified'] is True
          assert proof['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          subprocess.run([
              'git','merge-base','--is-ancestor',
              'b54879d7c04ba914997f14034c3c1b262b9629f6',
              os.environ['BASE_MAIN']
          ],check=True)
          print('SG-000011 prerequisite: PASS')
          PY

          specgrain draft             --title "Add baseline mutation terminal state primitive"             --outcome "morize-core exposes one dependency-free non-exhaustive MutationTerminalState enum covering the four planned terminal states already fixed by docs/DATA_MODEL.md, without defining mutation records, transition rules, dependent-mutation blocking, reconciliation execution, retry/idempotency policy, serialization, persistence, or transport semantics."             --rationale "docs/DATA_MODEL.md fixes the planned mutation terminal states as COMMITTED, REJECTED, FAILED, and UNKNOWN_OUTCOME and states that unknown outcome is not success. This Grain adds only the typed terminal-state distinction so later mutation/reconciliation Grains can build on a bounded vocabulary without inventing transition, retry, persistence, or orchestration behavior."             --parent SG-000010             --json . > /tmp/sg21-draft.json

          test -f .specgrain/specs/SG-000021.json

          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.specgrain/specs/SG-000021.json')
          data=json.loads(path.read_text())
          data['metadata'] = {
            'method': {
              'control': 'Implementation is limited to one dependency-free non-exhaustive in-memory MutationTerminalState enum, focused tests, and morize-core re-exports. No mutation record, transition engine, dependent-mutation blocking, reconciliation execution, retry/idempotency policy, persistence, serialization, transport mapping, or third-party dependency is authorized.',
              'review_separation': 'An independent semantic reviewer must review the exact implementation head, exact four-state baseline fidelity, non-exhaustive compatibility choice, UNKNOWN_OUTCOME non-success semantics, absence of transition/reconciliation/persistence behavior, scope containment, and required evidence separately from the implementing agent before acceptance.',
              'rollback': 'Revert the mutation-terminal-state implementation commits; no persisted mutation record, transition engine, retry state, reconciliation state, transport contract, or user data depends on this Grain.'
            },
            'morize': {
              'proof_prerequisites': [
                {
                  'implementation_revision': 'b54879d7c04ba914997f14034c3c1b262b9629f6',
                  'record_digest': 'sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9',
                  'spec_id': 'SG-000011',
                  'spec_revision': 'sha256:0c609888d253ab94487f9e1bdd2e5370f991321d57269f0b237d778ac30f129d'
                }
              ]
            }
          }
          path.write_text(json.dumps(data,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

          git add .specgrain/specs/SG-000010.json .specgrain/specs/SG-000021.json
          git diff --cached --check
          git commit -s -m "specgrain: draft mutation terminal state Grain"

          specgrain shape SG-000021             --scope-in "Define public non-exhaustive MutationTerminalState with current baseline variants Committed, Rejected, Failed, and UnknownOutcome, matching docs/DATA_MODEL.md planned terminal semantics."             --scope-in "Keep all four current variants fieldless and derive only Clone, Copy, Debug, PartialEq, Eq, and Hash so terminal state is typed without defining ordering, textual/numeric encoding, transition legality, retryability, or transport behavior."             --scope-in "Document UnknownOutcome as an ambiguous non-success terminal classification. The enum itself does not perform reconciliation or authorize/execute dependent mutations."             --scope-in "Add standard-library-only focused tests covering all four current values, distinct equality/hash semantics, Copy behavior, and the exact current baseline variant set without serialization or parser contracts."             --scope-out "Mutation record structs, mutation IDs, action payloads, state-transition machines, transition legality, terminal-state constructors, durable write boundaries, commit protocols, or side effects."             --scope-out "Dependent-mutation blocking enforcement, reconciliation algorithms, retry/idempotency policy, compare-and-swap, crash recovery, cancellation, or unknown-outcome resolution."             --scope-out "Display/FromStr, parsers, serde or other serialization integration, numeric repr/discriminants, persisted or wire encoding, HTTP/IPC/MCP mappings, CLI exit codes, configuration, migrations, storage, or retrieval integration."             --scope-out "Any third-party runtime, build, or test dependency."             --acceptance "morize-core exports MutationTerminalState with current baseline variants Committed, Rejected, Failed, and UnknownOutcome and no additional current variant."             --acceptance "MutationTerminalState is marked non_exhaustive because docs/DATA_MODEL.md calls these planned terminal semantics rather than declaring a permanently closed public vocabulary."             --acceptance "All four current variants are fieldless, and UnknownOutcome is documented as non-success without implementing reconciliation or dependent-mutation blocking behavior."             --acceptance "MutationTerminalState supports Clone, Copy, Debug, PartialEq, Eq, and Hash; focused tests exercise all four current variants and confirm distinct value semantics without defining an ordering contract."             --acceptance "The implementation defines no mutation record, transition engine, transition legality, retry/idempotency policy, compare-and-swap, reconciliation algorithm, dependent-mutation blocking execution, Display, FromStr, parser, serde integration, numeric repr/discriminants, or wire/persistence format."             --acceptance "cargo fmt --all -- --check passes on the exact implementation head."             --acceptance "cargo check --workspace --all-targets --offline passes on the exact implementation head."             --acceptance "cargo clippy --workspace --all-targets --offline -- -D warnings passes on the exact implementation head."             --acceptance "cargo test --workspace --all-targets --offline passes and includes focused tests for all four current mutation terminal states and required value semantics."             --acceptance "Cargo manifests and Cargo.lock are unchanged; the Grain admits no runtime, build, or test dependency."             --acceptance "GitHub Actions passes Ubuntu, macOS, and Windows on the exact implementation head before acceptance."             --acceptance "An independent semantic reviewer reviews the exact implementation head for four-state baseline fidelity, non-exhaustive compatibility choice, UnknownOutcome non-success semantics, absence of transition/reconciliation/persistence behavior, scope containment, and required evidence."             --acceptance "ADR-0004 proof prerequisite for SG-000011 revalidates against the exact WorkPacket baseline before execution."             --acceptance "The implementation changes no path outside crates/morize-core/src/mutation.rs and crates/morize-core/src/lib.rs."             --risk-level medium             --recovery "Revert the mutation-terminal-state implementation commits; no persisted mutation record, transition engine, retry state, reconciliation state, transport contract, or user data has been written by this Grain."             --context-budget 11000             --context-estimate 5600             --change-surface "crates/morize-core/src/mutation.rs"             --change-surface "crates/morize-core/src/lib.rs"             --evidence rollback             --evidence independent-review             --evidence E-PROOF-PREREQUISITE-SG000011             --evidence E-MUTATION-TERMINAL-BASELINE             --evidence E-MUTATION-TERMINAL-NONEXHAUSTIVE             --evidence E-MUTATION-TERMINAL-FIELDLESS             --evidence E-UNKNOWN-OUTCOME-NON-SUCCESS             --evidence E-MUTATION-TERMINAL-VALUE-SEMANTICS             --evidence E-MUTATION-TERMINAL-NO-DEPENDENCIES             --evidence E-RUST-FMT             --evidence E-RUST-CHECK-OFFLINE             --evidence E-RUST-CLIPPY-OFFLINE             --evidence E-RUST-TEST-OFFLINE             --evidence E-CROSS-PLATFORM-CI             --minimality-choice native             --minimality-rationale "One standard-library-only four-variant baseline enum is the narrowest implementation of the already-documented mutation terminal-state vocabulary while deferring mutation records, transition/reconciliation behavior, retry/idempotency policy, serialization, and persistence."             --safety-status requirements-defined             --safety-requirement "UnknownOutcome must remain a non-success classification; this primitive must not silently convert ambiguous completion into success or itself authorize dependent mutations."             --json . > /tmp/sg21-shape.json

          git add .specgrain/specs/SG-000021.json
          git diff --cached --check
          git commit -s -m "specgrain: shape mutation terminal state contract"

          specgrain refine SG-000021 --json . > /tmp/sg21-refine.json
          git add .specgrain/specs/SG-000021.json
          git diff --cached --check
          git commit -s -m "specgrain: refine mutation terminal state Grain"

          specgrain grain SG-000021 --json . > /tmp/sg21-grain.json
          rm -rf .specgrain/tmp
          git add .specgrain/specs/SG-000021.json
          git diff --cached --check
          git commit -s -m "specgrain: promote mutation terminal state contract to Grain"

          PLAN_HEAD="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

          specgrain check --json . > /tmp/sg21-check.json
          specgrain next --json . > /tmp/sg21-next.json
          python - <<'PY'
          import json
          check=json.load(open('/tmp/sg21-check.json'))
          nxt=json.load(open('/tmp/sg21-next.json'))
          assert check['valid'] is True and check['issues']==[]
          assert 'SG-000021' in nxt['eligible']
          print('SpecGrain final qualification: PASS')
          PY

          SPEC_REVISION="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/sg21-grain.json'))['revision_digest'])
          PY
          )"
          DIFF_SHA256="$(git diff "$BASE_MAIN...$PLAN_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sha256sum | awk '{print $1}')"
          test "$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sort | tr '\n' ' ')" = ".specgrain/specs/SG-000010.json .specgrain/specs/SG-000021.json "

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg21-plan-diffcipline.json 2>/tmp/sg21-plan-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg21-plan-diffcipline.json | awk '{print $1}')"
          python - <<'PY'
          import json
          lines=[line for line in open('/tmp/sg21-plan-diffcipline.json') if line.strip()]
          x=json.loads(lines[-1])
          assert x['verdict']=='PASS'
          assert x['changed_files']==2
          assert x['scope_violations']==[]
          assert all(v['state']=='PASS' for v in x['verification'])
          print('Diffcipline exact-head: PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$PLAN_HEAD"             > /tmp/sg21-plan-ocr-preview.json
          python - <<'PY'
          import json, subprocess
          x=json.load(open('/tmp/sg21-plan-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=[f['path'] for f in x['reviewable_files']]
          assert sorted(paths)==['.specgrain/specs/SG-000010.json','.specgrain/specs/SG-000021.json']
          with open('/tmp/sg21-plan-ocr-rules.json','w') as out:
              subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*paths],check=True,stdout=out)
          groups=json.load(open('/tmp/sg21-plan-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==sorted(paths)
          print('Alibaba accounting: 2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          export PLAN_HEAD SPEC_REVISION DIFF_SHA256 FILE_LIST_SHA256 DIFFCIPLINE_SHA256 BASE_MAIN
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from gradio_client import Client

          spec=Path('.specgrain/specs/SG-000021.json').read_text()
          head=os.environ['PLAN_HEAD']

          prompt='\n'.join([
              'Independent semantic PLANNING review of Morize SG-000021. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={head}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={os.environ["SPEC_REVISION"]}',
              f'DIFF_SHA256={os.environ["DIFF_SHA256"]}',
              f'FILE_LIST_SHA256={os.environ["FILE_LIST_SHA256"]}',
              f'DIFFCIPLINE_SHA256={os.environ["DIFFCIPLINE_SHA256"]}',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              'Exact changed paths: .specgrain/specs/SG-000010.json and .specgrain/specs/SG-000021.json.',
              'SpecGrain check valid=true issues=[]; SG-000021 eligible=true.',
              'SG-000011 prerequisite: verified=true, record=sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9.',
              '',
              'Repository authority:',
              '- docs/DATA_MODEL.md section 15 lists planned mutation terminal semantics: COMMITTED, REJECTED, FAILED, UNKNOWN_OUTCOME.',
              '- The same section states unknown outcome is not success and blocks dependent mutations until reconciliation.',
              '- MZ-REL-005 states ambiguous partial completion shall not be reported as success.',
              '- This Grain types only the baseline terminal-state vocabulary. It must not implement mutation records, state transitions, dependent-mutation blocking, reconciliation, retry/idempotency, persistence, serialization, or transport behavior.',
              '- Because the repository calls these planned terminal semantics rather than a permanently closed public vocabulary, non_exhaustive is the conservative compatibility choice.',
              '',
              'Review goals:',
              '1. Exact four-current-state fidelity.',
              '2. non_exhaustive is coherent and does not falsely close future compatibility.',
              '3. UnknownOutcome is explicitly non-success.',
              '4. Blocking/reconciliation execution is deferred, not accidentally implemented by the enum.',
              '5. All variants fieldless; derives only Clone, Copy, Debug, PartialEq, Eq, Hash; no ordering.',
              '6. No mutation records, transitions, retry/idempotency, CAS, crash recovery, parser, serialization, numeric, wire, persistence, or transport semantics.',
              '7. Exact two-file planning scope, rollback, SG-000011 prerequisite, acceptance/evidence coherence, and no third-party dependency.',
              '',
              'SG-000021 Grain:',
              spec,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              head,
              'REVIEW_KIND',
              'SG-000021_PLANNING',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.'
          ])

          Path('/tmp/sg21-plan-north-prompt.txt').write_text(prompt)
          client=Client('CohereLabs/North-Mini-Code-1.0',verbose=False)
          final=''
          for attempt in range(1,4):
              raw=client.predict(prompt,'Rust','[]','{}',api_name='/chat')
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=''
              for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
                  if msg.get('role')=='assistant':
                      content=msg.get('content','')
              candidate=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
              structured=(f'REVIEW_HEAD\n{head}' in candidate and 'REVIEW_KIND\nSG-000021_PLANNING' in candidate)
              if structured:
                  final=candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt < 3:
                  time.sleep(10)
          if not final:
              raise SystemExit('independent semantic planning reviewer returned no structured review after 3 provider attempts')

          checks=[
              f'REVIEW_HEAD\n{head}',
              'REVIEW_KIND\nSG-000021_PLANNING',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              print(final)
              raise SystemExit('independent semantic planning review produced a structured non-PASS result')

          Path('/tmp/sg21-plan-north-final.md').write_text(final+'\n')
          summary={
              'base_main':os.environ['BASE_MAIN'],
              'planning_head':head,
              'spec_revision':os.environ['SPEC_REVISION'],
              'diff_sha256':os.environ['DIFF_SHA256'],
              'file_list_sha256':os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256':os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256':hashlib.sha256((final+'\n').encode()).hexdigest()
          }
          Path('/tmp/sg21-plan-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$PLAN_BRANCH"

          {
            echo "## SG-000021 planning qualification"
            echo
            cat /tmp/sg21-plan-summary.json
            echo
            echo "SpecGrain final qualification: PASS"
            echo "Diffcipline exact-head: PASS"
            echo "Alibaba accounting: 2/2"
            echo "Independent semantic planning review: PASS"
            echo "Pushed clean branch: $PLAN_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
