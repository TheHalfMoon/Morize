name: SG-000027 implementation qualification

on:
  push:
    branches:
      - automation/sg-000027-implementation-review
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Qualify exact SG-000027 implementation head
        shell: bash
        env:
          BASE_MAIN: c76496d9b701088d1bd9292df63d16925ce34fce
          IMPL_HEAD: b20503493b693a96a0a97c120d5605a304874630
          SPEC_REVISION: sha256:7256886d9dfaf74c77e21531e51c72bf5e7b8889f40866b5851096eb9a9918ad
          WORKPACKET_DIGEST: sha256:33323089ff7a003f3fe9a4e144f3636b70f25b26ab233fef818a69026c0826ec
          WORKPACKET_FILE_SHA256: 610843f07e14848215fff88282d0a9ec5a584503c996bf2c5a1b4974380fa3c8
          WORKPACKET_ARTIFACT_SHA256: ab0cd3a38cda3f040009272188e3216effc37802cbaa2afe68538a62560578d0
          WORKPACKET_RUN: "35563621204"
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main impl/sg-000027-decision-reason-code --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/impl/sg-000027-decision-reason-code)" = "$IMPL_HEAD"
          git checkout --detach "$IMPL_HEAD"
          test "$(git rev-parse HEAD)" = "$IMPL_HEAD"
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check --quiet \
            "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg27-check.json
          specgrain prove SG-000026 . --json > /tmp/sg27-p26.json

          python - <<'PY'
          import json
          import os
          import subprocess
          from specgrain import load_project

          check = json.load(open('/tmp/sg27-check.json'))
          assert check['valid'] is True and check['issues'] == [], check

          project = load_project('.')
          node = next(n for n in project.specs if n.id == 'SG-000027')
          assert node.state == 'GRAIN', node.state
          assert node.revision_digest == os.environ['SPEC_REVISION'], node.revision_digest
          assert tuple(sorted(node.change_surface)) == tuple(sorted([
              'crates/morize-core/src/decision.rs',
              'crates/morize-core/src/lib.rs',
          ])), node.change_surface

          proof = json.load(open('/tmp/sg27-p26.json'))
          assert proof['verified'] is True, proof
          assert proof['latest_record_digest'] == 'sha256:00886cf4d320750bfd5da6e47a3eccdfebd09512da364c7737d0b6f103a5316b', proof
          latest = proof['records'][-1]['report']
          assert latest['spec_revision'] == 'sha256:af72b5d0c6757c4051f3cb7dc7c2e3de49cdcda77b6c863d1ad1e07a2d1acc1d', latest
          assert latest['implementation_revision'] == '622016763bad9bfbd54a1cb6d7bcac342f21e95c', latest
          assert latest['issues'] == [], latest
          subprocess.run([
              'git', 'merge-base', '--is-ancestor',
              latest['implementation_revision'], os.environ['BASE_MAIN'],
          ], check=True)

          print('SPEC_CHECK=PASS')
          print('SG000026_PREREQUISITE=PASS')
          print('SG000027_SPEC_REVISION=' + node.revision_digest)
          print('WORKPACKET_BINDING=' + os.environ['WORKPACKET_DIGEST'])
          print('WORKPACKET_RUN=' + os.environ['WORKPACKET_RUN'])
          PY

          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sort | tr '\n' ' ')" = "crates/morize-core/src/decision.rs crates/morize-core/src/lib.rs "
          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | wc -l)" -eq 2
          test -z "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" -- Cargo.toml Cargo.lock '*/Cargo.toml')"
          git diff --check "$BASE_MAIN...$IMPL_HEAD"

          DIFF_SHA256="$(git diff "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          export DIFF_SHA256 FILE_LIST_SHA256

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline
          cargo clippy --workspace --all-targets --offline -- -D warnings
          cargo test --workspace --all-targets --offline 2>&1 | tee /tmp/sg27-tests.txt

          python - <<'PY'
          import re
          text = open('/tmp/sg27-tests.txt').read()
          counts = [int(x) for x in re.findall(r'test result: ok\. (\d+) passed;', text)]
          assert counts, counts
          total = sum(counts)
          assert total == 43, (counts, total)
          print('EXACT_HEAD_TESTS_PASSED=43')
          PY

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked \
            --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml -- \
            check --base "$BASE_MAIN" --risk R2 --run --json \
            > /tmp/sg27-diffcipline.json 2>/tmp/sg27-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg27-diffcipline.json | awk '{print $1}')"
          export DIFFCIPLINE_SHA256

          python - <<'PY'
          import json
          lines = [line for line in open('/tmp/sg27-diffcipline.json') if line.strip()]
          result = json.loads(lines[-1])
          assert result['verdict'] == 'PASS', result
          assert result['changed_files'] == 2, result
          assert result['scope_violations'] == [], result
          assert all(item['state'] == 'PASS' for item in result['verification']), result
          print('DIFFCIPLINE=PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview \
            --format json \
            --from "$BASE_MAIN" \
            --to "$IMPL_HEAD" \
            > /tmp/sg27-ocr-preview.json

          python - <<'PY'
          import json
          import subprocess
          preview = json.load(open('/tmp/sg27-ocr-preview.json'))
          assert preview['total_files'] == 2, preview
          assert preview['reviewable_count'] == 2, preview
          assert preview['excluded_count'] == 0, preview
          paths = sorted(item['path'] for item in preview['reviewable_files'])
          assert paths == [
              'crates/morize-core/src/decision.rs',
              'crates/morize-core/src/lib.rs',
          ], paths
          with open('/tmp/sg27-ocr-rules.json', 'w') as output:
              subprocess.run([
                  '/tmp/ocr-bin', 'delegate', 'rule', '--format', 'json', *paths
              ], check=True, stdout=output)
          groups = json.load(open('/tmp/sg27-ocr-rules.json'))['groups']
          accounted = sorted(path for group in groups for path in group['files'])
          assert accounted == paths, accounted
          print('ALIBABA_ACCOUNTING=2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          from pathlib import Path
          from gradio_client import Client

          spec = Path('.specgrain/specs/SG-000027.json').read_text()
          diff = subprocess.check_output([
              'git', 'diff', '--unified=80',
              os.environ['BASE_MAIN'] + '...' + os.environ['IMPL_HEAD'],
              '--',
              'crates/morize-core/src/decision.rs',
              'crates/morize-core/src/lib.rs',
          ], text=True)

          prompt = '\n'.join([
              'Independent semantic IMPLEMENTATION review of Morize SG-000027. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={os.environ["IMPL_HEAD"]}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={os.environ["SPEC_REVISION"]}',
              f'WORKPACKET_DIGEST={os.environ["WORKPACKET_DIGEST"]}',
              f'WORKPACKET_FILE_SHA256={os.environ["WORKPACKET_FILE_SHA256"]}',
              f'WORKPACKET_ARTIFACT_SHA256={os.environ["WORKPACKET_ARTIFACT_SHA256"]}',
              f'WORKPACKET_RUN={os.environ["WORKPACKET_RUN"]}',
              f'DIFF_SHA256={os.environ["DIFF_SHA256"]}',
              f'FILE_LIST_SHA256={os.environ["FILE_LIST_SHA256"]}',
              f'DIFFCIPLINE_SHA256={os.environ["DIFFCIPLINE_SHA256"]}',
              'Exact-head cargo verification: fmt/check/clippy PASS; tests 43/43 PASS.',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              '',
              'Review goals:',
              '1. DecisionReasonCode is public and non-exhaustive with exactly the 11 currently documented known variants.',
              '2. The implementation clearly avoids claiming those 11 variants exhaust the future reason-code vocabulary.',
              '3. DecisionReasonCode derives only Clone, Copy, Debug, PartialEq, Eq, and Hash and introduces no ordering contract.',
              '4. No stable text spelling, numeric repr/discriminant, Display/FromStr, parser, serde, wire representation, persistence encoding, migration, API, MCP, or dependency is introduced.',
              '5. Reason codes are descriptive evidence only and grant no authorization, target selection, policy decision, mutation authority, threshold override, execution, storage behavior, or side effect.',
              '6. No DecisionEnvelope, candidate/action score, confidence, abstention, evidence binding, engine identity, policy revision, replay, or domain-record behavior is introduced.',
              '7. Exact implementation surface is decision.rs plus lib.rs only; Cargo manifests and Cargo.lock remain unchanged.',
              '8. SG-000026 proof identity remains exact and the immutable SG-000027 WorkPacket was exported before this execution.',
              '9. Focused tests prove all 11 known variants are distinct and preserve copy/hash value semantics without defining ordering.',
              '',
              'SG-000027 contract:',
              spec,
              '',
              'Exact implementation diff:',
              diff,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              os.environ['IMPL_HEAD'],
              'REVIEW_KIND',
              'SG-000027_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.',
          ])

          Path('/tmp/sg27-review-prompt.txt').write_text(prompt)
          client = Client('CohereLabs/North-Mini-Code-1.0', verbose=False)
          final = ''
          for attempt in range(1, 4):
              raw = client.predict(prompt, 'Rust', '[]', '{}', api_name='/chat')
              obj = json.loads(raw) if isinstance(raw, str) else raw
              content = ''
              for message in obj.get('history', []) if isinstance(obj, dict) else []:
                  if message.get('role') == 'assistant':
                      content = message.get('content', '')
              candidate = content.split('</think>', 1)[-1].strip() if '</think>' in content else content.strip()
              structured = (
                  f'REVIEW_HEAD\n{os.environ["IMPL_HEAD"]}' in candidate
                  and 'REVIEW_KIND\nSG-000027_IMPLEMENTATION' in candidate
              )
              if structured:
                  final = candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt < 3:
                  time.sleep(10)

          if not final:
              raise SystemExit('independent implementation reviewer returned no structured review after 3 attempts')

          Path('/tmp/sg27-review-final.txt').write_text(final + '\n')
          print('INDEPENDENT_REVIEW_BEGIN')
          print(final)
          print('INDEPENDENT_REVIEW_END')

          checks = [
              f'REVIEW_HEAD\n{os.environ["IMPL_HEAD"]}',
              'REVIEW_KIND\nSG-000027_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS\n- NONE',
              'FINAL_GATE = PASS',
          ]
          if not all(item in final for item in checks):
              raise SystemExit('independent semantic implementation review produced a non-PASS result')

          summary = {
              'base_main': os.environ['BASE_MAIN'],
              'implementation_head': os.environ['IMPL_HEAD'],
              'spec_revision': os.environ['SPEC_REVISION'],
              'workpacket_digest': os.environ['WORKPACKET_DIGEST'],
              'workpacket_file_sha256': os.environ['WORKPACKET_FILE_SHA256'],
              'workpacket_artifact_sha256': os.environ['WORKPACKET_ARTIFACT_SHA256'],
              'workpacket_run': os.environ['WORKPACKET_RUN'],
              'diff_sha256': os.environ['DIFF_SHA256'],
              'file_list_sha256': os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256': os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256': hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256': hashlib.sha256((final + '\n').encode()).hexdigest(),
              'tests_passed': 43,
              'alibaba_reviewable_files': 2,
              'alibaba_excluded_files': 0,
              'final_gate': 'PASS',
          }
          Path('/tmp/sg27-qualification-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('QUALIFICATION_SUMMARY_BEGIN')
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('QUALIFICATION_SUMMARY_END')
          PY

          test -z "$(git status --porcelain)"

      - name: Upload exact-head qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sg-000027-implementation-qualification
          path: |
            /tmp/sg27-check.json
            /tmp/sg27-p26.json
            /tmp/sg27-tests.txt
            /tmp/sg27-diffcipline.json
            /tmp/sg27-diffcipline.err
            /tmp/sg27-ocr-preview.json
            /tmp/sg27-ocr-rules.json
            /tmp/sg27-review-prompt.txt
            /tmp/sg27-review-final.txt
            /tmp/sg27-qualification-summary.json
          if-no-files-found: error
          retention-days: 30
