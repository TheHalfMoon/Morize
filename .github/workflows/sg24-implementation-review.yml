name: sg24-implementation-review

on:
  push:
    branches:
      - automation/sg-000024-implementation-review

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Qualify exact SG-000024 implementation head
        shell: bash
        env:
          BASE_MAIN: 687d5681d616dce0d84809992c9d36e791f77eb9
          IMPL_HEAD: c3c9e144cd0173206781b4703f543d359e2ff61e
          SPEC_REVISION: sha256:71afd4f7e9a9d16438fdda6181a0a6774c731e87737711f5f6d8e38e350b7e96
          WORKPACKET_DIGEST: sha256:f30e31c88fa088c6051c2e962777eb25e7fb60beaebcf451da2f0c176cec2c5b
          WORKPACKET_FILE_SHA256: fcb450c99b35721c7f9587776d7b2bee6cd4de3025b72ae1c6234ce8cee26a79
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
          CARGO_FUZZ_VERSION: "0.13.2"
          CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
          RUST_NIGHTLY: nightly-2026-09-18
          FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail

          git fetch origin main impl/sg-000024-isolated-fuzz-harness-v2 --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/impl/sg-000024-isolated-fuzz-harness-v2)" = "$IMPL_HEAD"
          git checkout --detach "$IMPL_HEAD"
          test "$(git rev-parse HEAD)" = "$IMPL_HEAD"
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg24-check.json
          specgrain prove --json SG-000012 . > /tmp/p12.json
          specgrain prove --json SG-000013 . > /tmp/p13.json
          specgrain prove --json SG-000014 . > /tmp/p14.json
          specgrain prove --json SG-000023 . > /tmp/p23.json

          python - <<'PY'
          import json, os, subprocess, tomllib
          from specgrain import load_project

          check=json.load(open('/tmp/sg24-check.json'))
          assert check['valid'] is True and check['issues']==[]
          node=next(n for n in load_project('.').specs if n.id=='SG-000024')
          assert node.state=='GRAIN'
          assert node.revision_digest==os.environ['SPEC_REVISION']

          policy=tomllib.loads(open('.diffcipline.toml').read())
          assert policy['policy']['expected_files'].count('fuzz/**')==1

          expected={
            'SG-000012':('/tmp/p12.json','sha256:13fc136a4f74bf67a2928642d50b750cd729bb7811bfc3dd8f7369ed4a034079','sha256:256a8c55a843f00798f3e8e3f0807ee38f676a7f50c9b9380b9d26167f4f7aa7','026b2e5849759915975f8ae12b111d1185fda89f'),
            'SG-000013':('/tmp/p13.json','sha256:ab6bae1410aa8d48f7081aebe7047ffe8d5420b497b9f3d744639de9109cd62c','sha256:adf07a2ef558c801fcacbb3b1bb7ab627bdc0480fdec65e7fc2d1a2e86dafe8d','9db66a7b4225cd5d3eff9a65d910038352d29a59'),
            'SG-000014':('/tmp/p14.json','sha256:95a31438e65a266dfd513b8ed15af56f35fe1184d725672359b567008d67a977','sha256:06df9fd48a398fb1b1af3e4a6c821efa9a0508d7e9e3a795c21edadf1045ef1e','fac420fd87f86b97a5ee97397e0775d00795aaa3'),
            'SG-000023':('/tmp/p23.json','sha256:14dc204de67286a282a2b4e1d8d65fc8d9837b140ced660aa230745ddb82f68c','sha256:9e5cba94eec7f7488cdb02605db5cd7f4d1b41200282ca4efc0c68f058d0a779','4620805a440fe1ef5d29c9015b781014a5c109d2'),
          }
          for sid,(path,record,srev,impl) in expected.items():
              proof=json.load(open(path))
              assert proof['verified'] is True
              assert proof['latest_record_digest']==record
              latest=proof['records'][-1]['report']
              assert latest['spec_revision']==srev
              assert latest['implementation_revision']==impl
              assert latest['issues']==[]
              subprocess.run(['git','merge-base','--is-ancestor',impl,os.environ['BASE_MAIN']],check=True)
              print(sid+'_PREREQUISITE=PASS')

          print('SPEC_CHECK=PASS')
          print('SG000024_SPEC_REVISION='+node.revision_digest)
          print('WORKPACKET_DIGEST='+os.environ['WORKPACKET_DIGEST'])
          PY

          expected_files=".github/workflows/fuzz-smoke.yml fuzz/.gitignore fuzz/Cargo.lock fuzz/Cargo.toml fuzz/README.md fuzz/THIRD_PARTY.md fuzz/fuzz_targets/bounded_utf8.rs fuzz/fuzz_targets/bounded_vec.rs fuzz/fuzz_targets/durable_id.rs fuzz/rust-toolchain.toml "
          actual_files="$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sort | tr '\n' ' ')"
          echo "IMPLEMENTATION_FILES=$actual_files"
          test "$actual_files" = "$expected_files"
          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | wc -l)" -eq 10
          git diff --check "$BASE_MAIN...$IMPL_HEAD"

          test "$(git rev-parse "$BASE_MAIN:Cargo.toml")" = "$(git rev-parse "$IMPL_HEAD:Cargo.toml")"
          test "$(git rev-parse "$BASE_MAIN:Cargo.lock")" = "$(git rev-parse "$IMPL_HEAD:Cargo.lock")"
          test "$(git rev-parse "$BASE_MAIN:.github/workflows/ci.yml")" = "$(git rev-parse "$IMPL_HEAD:.github/workflows/ci.yml")"
          test "$(git rev-parse "$BASE_MAIN:crates/morize-core")" = "$(git rev-parse "$IMPL_HEAD:crates/morize-core")"
          echo "ROOT_AND_PRODUCTION_UNCHANGED=PASS"

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline
          cargo clippy --workspace --all-targets --offline -- -D warnings
          cargo test --workspace --all-targets --offline 2>&1 | tee /tmp/root-tests.txt
          python - <<'PY'
          import re
          text=open('/tmp/root-tests.txt').read()
          counts=[int(x) for x in re.findall(r'test result: ok\. (\d+) passed;',text)]
          assert counts and sum(counts)==33, counts
          print('ROOT_TESTS_PASSED=33')
          PY

          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          rustup component add rust-src --toolchain "$RUST_NIGHTLY"
          rustc +"$RUST_NIGHTLY" --version --verbose | tee /tmp/rustc-version.txt
          grep -q "release: 1.100.0-nightly" /tmp/rustc-version.txt
          grep -q "commit-hash: 330d317121e16b5db8e5adc63595910528ff2ee7" /tmp/rustc-version.txt
          echo "FUZZ_TOOLCHAIN_PIN=PASS"

          curl --fail --location --silent --show-error             "https://github.com/rust-fuzz/cargo-fuzz/releases/download/$CARGO_FUZZ_VERSION/cargo-fuzz-$CARGO_FUZZ_VERSION-x86_64-unknown-linux-musl.tar.gz"             --output /tmp/cargo-fuzz.tar.gz
          echo "$CARGO_FUZZ_SHA256  /tmp/cargo-fuzz.tar.gz" | sha256sum --check
          tar -xzf /tmp/cargo-fuzz.tar.gz -C /tmp
          install -m 0755 /tmp/cargo-fuzz "$HOME/.cargo/bin/cargo-fuzz"
          cargo fuzz --version | grep -q "cargo-fuzz 0.13.2"
          echo "CARGO_FUZZ_PIN=PASS"

          export RUSTUP_TOOLCHAIN="$RUST_NIGHTLY"
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /tmp/fuzz-metadata.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/fuzz-metadata.json'))
          assert x['workspace_root'].endswith('/fuzz')
          packages={p['name']:p for p in x['packages']}
          assert packages['morize-fuzz']['publish']==[]
          libs=[p for p in x['packages'] if p['name']=='libfuzzer-sys']
          assert len(libs)==1 and libs[0]['version']=='0.4.13'
          assert len([p for p in x['packages'] if p['name']=='morize-core'])==1
          print('FUZZ_WORKSPACE_ISOLATION=PASS')
          PY

          cargo fuzz list --fuzz-dir fuzz | tee /tmp/targets.txt
          grep -qx durable_id /tmp/targets.txt
          grep -qx bounded_utf8 /tmp/targets.txt
          grep -qx bounded_vec /tmp/targets.txt

          cargo fuzz build --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" durable_id
          cargo fuzz build --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" bounded_utf8
          cargo fuzz build --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" bounded_vec

          rm -rf /tmp/sg24-review-corpus
          mkdir -p /tmp/sg24-review-corpus/durable_id /tmp/sg24-review-corpus/bounded_utf8 /tmp/sg24-review-corpus/bounded_vec
          printf '%032d' 0 > /tmp/sg24-review-corpus/durable_id/zero
          printf 'memory' > /tmp/sg24-review-corpus/bounded_utf8/ascii
          printf '\x00\x01\x02\x03' > /tmp/sg24-review-corpus/bounded_vec/bytes

          cargo fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" durable_id /tmp/sg24-review-corpus/durable_id --             -runs=1000 -seed=424242 -timeout=5 -rss_limit_mb=2048 -max_len=512
          cargo fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" bounded_utf8 /tmp/sg24-review-corpus/bounded_utf8 --             -runs=1000 -seed=424243 -timeout=5 -rss_limit_mb=2048 -max_len=512
          cargo fuzz run --fuzz-dir fuzz --target "$FUZZ_TARGET_TRIPLE" bounded_vec /tmp/sg24-review-corpus/bounded_vec --             -runs=1000 -seed=424244 -timeout=5 -rss_limit_mb=2048 -max_len=512
          unset RUSTUP_TOOLCHAIN
          echo "EXACT_HEAD_FUZZ_EXECUTION=PASS"

          grep -q 'libfuzzer-sys = "=0.4.13"' fuzz/Cargo.toml
          grep -q 'channel = "nightly-2026-09-18"' fuzz/rust-toolchain.toml
          grep -q 'cargo-fuzz: MIT OR Apache-2.0' fuzz/THIRD_PARTY.md
          grep -q 'Combined crate expression: (MIT OR Apache-2.0) AND NCSA' fuzz/THIRD_PARTY.md
          grep -q 'Bundled libFuzzer source license: NCSA' fuzz/THIRD_PARTY.md
          grep -q 'x86_64-unknown-linux-gnu' .github/workflows/fuzz-smoke.yml
          grep -q -- '-runs=5000' .github/workflows/fuzz-smoke.yml
          grep -q 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' .github/workflows/fuzz-smoke.yml
          echo "FUZZ_STATIC_CONTRACT=PASS"

          DIFF_SHA256="$(git diff "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          FUZZ_LOCK_SHA256="$(sha256sum fuzz/Cargo.lock | awk '{print $1}')"
          FUZZ_WORKFLOW_SHA256="$(sha256sum .github/workflows/fuzz-smoke.yml | awk '{print $1}')"
          export DIFF_SHA256 FILE_LIST_SHA256 FUZZ_LOCK_SHA256 FUZZ_WORKFLOW_SHA256

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R3 --run --json             > /tmp/sg24-diffcipline.json 2>/tmp/sg24-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg24-diffcipline.json | awk '{print $1}')"
          export DIFFCIPLINE_SHA256
          python - <<'PY'
          import json
          lines=[line for line in open('/tmp/sg24-diffcipline.json') if line.strip()]
          x=json.loads(lines[-1])
          assert x['verdict']=='PASS', x
          assert x['changed_files']==10, x
          assert x['scope_violations']==[], x
          assert all(v['state']=='PASS' for v in x['verification'])
          print('DIFFCIPLINE_R3=PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$IMPL_HEAD" > /tmp/sg24-ocr.json
          python - <<'PY'
          import json, subprocess
          x=json.load(open('/tmp/sg24-ocr.json'))
          assert x['total_files']==10
          reviewable=sorted(f['path'] for f in x.get('reviewable_files',[]))
          excluded=sorted(f['path'] for f in x.get('excluded_files',[]))
          expected=[
            '.github/workflows/fuzz-smoke.yml',
            'fuzz/.gitignore',
            'fuzz/Cargo.lock',
            'fuzz/Cargo.toml',
            'fuzz/README.md',
            'fuzz/THIRD_PARTY.md',
            'fuzz/fuzz_targets/bounded_utf8.rs',
            'fuzz/fuzz_targets/bounded_vec.rs',
            'fuzz/fuzz_targets/durable_id.rs',
            'fuzz/rust-toolchain.toml',
          ]
          assert sorted(reviewable+excluded)==expected
          accounted=[]
          if reviewable:
              with open('/tmp/sg24-rules.json','w') as out:
                  subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*reviewable],check=True,stdout=out)
              groups=json.load(open('/tmp/sg24-rules.json'))['groups']
              accounted=sorted(p for g in groups for p in g['files'])
              assert accounted==reviewable
          summary={'total':10,'reviewable':reviewable,'excluded':excluded,'rule_accounted':accounted}
          open('/tmp/sg24-ocr-summary.json','w').write(json.dumps(summary,sort_keys=True))
          print('ALIBABA_ACCOUNTING='+json.dumps(summary,sort_keys=True))
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          python - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          from gradio_client import Client

          spec=Path('.specgrain/specs/SG-000024.json').read_text()
          diff=subprocess.check_output(['git','diff','--unified=40',os.environ['BASE_MAIN']+'...'+os.environ['IMPL_HEAD']],text=True)
          ocr=Path('/tmp/sg24-ocr-summary.json').read_text()

          prompt='\n'.join([
              'Independent semantic IMPLEMENTATION review of Morize SG-000024. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={os.environ["IMPL_HEAD"]}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={os.environ["SPEC_REVISION"]}',
              f'WORKPACKET_DIGEST={os.environ["WORKPACKET_DIGEST"]}',
              f'DIFF_SHA256={os.environ["DIFF_SHA256"]}',
              f'FILE_LIST_SHA256={os.environ["FILE_LIST_SHA256"]}',
              f'FUZZ_LOCK_SHA256={os.environ["FUZZ_LOCK_SHA256"]}',
              f'FUZZ_WORKFLOW_SHA256={os.environ["FUZZ_WORKFLOW_SHA256"]}',
              f'DIFFCIPLINE_SHA256={os.environ["DIFFCIPLINE_SHA256"]}',
              'Automated exact-head qualification: root fmt/check/clippy/tests PASS with 33 tests; root Cargo manifests/lock/core production tree/standard CI file unchanged; pinned nightly and cargo-fuzz identity PASS; independent fuzz workspace lock/isolation PASS; all three fuzz targets build and execute bounded 1000-run campaigns PASS; Diffcipline R3 PASS with zero scope violations.',
              'Alibaba accounting: '+ocr,
              '',
              'Review goals:',
              '1. Exact diff is only the ten SG-000024 files.',
              '2. Fuzz workspace is isolated from the root/runtime dependency graph and production source.',
              '3. Durable-ID target only reasons about successful parses of valid UTF-8 and enforces canonical lowercase text/exact bytes for every durable ID type.',
              '4. BoundedUtf8 target proves iff byte-limit acceptance, exact byte preservation, and exact TooLong metadata for multiple const limits.',
              '5. BoundedVec target proves construction/push bounds, order/value preservation, lossless rejected values, and no mutation after rejected push for multiple const limits.',
              '6. Fuzz workflow uses pinned nightly-2026-09-18 and cargo-fuzz 0.13.2 asset checksum, builds/runs targets for x86_64-unknown-linux-gnu, and uses fixed bounded smoke controls.',
              '7. Failure artifacts are uploaded through the pinned artifact action; absence on success is not treated as missing evidence.',
              '8. Fuzz-only license/provenance closure correctly records cargo-fuzz and libfuzzer-sys/NCSA boundaries.',
              '9. No network/filesystem fixture/environment/wall-clock/model/persistence/domain operation occurs in target code; no unsafe block is authored in the target files.',
              '10. Documentation makes only bounded-smoke claims and does not claim exhaustive fuzzing, bug absence, coverage completeness, or security proof.',
              '11. SG12/13/14/23 proof prerequisite identities and corrected Diffcipline fuzz scope admission remain intact.',
              '12. Dedicated PR fuzz-smoke and cross-platform PR CI are dynamic merge gates and are not implied by this semantic review.',
              '',
              'SG-000024 contract:',
              spec,
              '',
              'Exact implementation diff:',
              diff,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              os.environ['IMPL_HEAD'],
              'REVIEW_KIND',
              'SG-000024_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.'
          ])
          Path('/tmp/sg24-review-prompt.txt').write_text(prompt)

          client=Client('CohereLabs/North-Mini-Code-1.0',verbose=False)
          final=''
          for attempt in range(1,4):
              raw=client.predict(prompt,'Rust','[]','{}',api_name='/chat')
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=''
              for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
                  if msg.get('role')=='assistant':
                      content=msg.get('content','')
              candidate=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
              structured=(f'REVIEW_HEAD\n{os.environ["IMPL_HEAD"]}' in candidate and 'REVIEW_KIND\nSG-000024_IMPLEMENTATION' in candidate)
              if structured:
                  final=candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt<3:
                  time.sleep(10)
          if not final:
              raise SystemExit('independent implementation reviewer returned no structured review')

          print('INDEPENDENT_REVIEW_BEGIN')
          print(final)
          print('INDEPENDENT_REVIEW_END')
          required=[
              f'REVIEW_HEAD\n{os.environ["IMPL_HEAD"]}',
              'REVIEW_KIND\nSG-000024_IMPLEMENTATION',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in required):
              raise SystemExit('independent semantic implementation review produced a non-PASS result')

          summary={
              'base_main':os.environ['BASE_MAIN'],
              'implementation_head':os.environ['IMPL_HEAD'],
              'spec_revision':os.environ['SPEC_REVISION'],
              'workpacket_digest':os.environ['WORKPACKET_DIGEST'],
              'workpacket_file_sha256':os.environ['WORKPACKET_FILE_SHA256'],
              'diff_sha256':os.environ['DIFF_SHA256'],
              'file_list_sha256':os.environ['FILE_LIST_SHA256'],
              'fuzz_lock_sha256':os.environ['FUZZ_LOCK_SHA256'],
              'fuzz_workflow_sha256':os.environ['FUZZ_WORKFLOW_SHA256'],
              'diffcipline_sha256':os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256':hashlib.sha256((final+'\n').encode()).hexdigest(),
              'root_tests_passed':33,
              'qualification_fuzz_runs_per_target':1000,
          }
          print('QUALIFICATION_SUMMARY_BEGIN')
          print(json.dumps(summary,indent=2,sort_keys=True))
          print('QUALIFICATION_SUMMARY_END')
          PY

          test -z "$(git status --porcelain)"
