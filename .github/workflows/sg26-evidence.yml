name: SG-000026 native evidence generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  generate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANONICAL_MAIN: 622016763bad9bfbd54a1cb6d7bcac342f21e95c
      PACKET_BASE: 404f46f34ab168c0b2b391784c553f58a93ae9df
      IMPL_HEAD: f6f574266518fd9c77abc433de4922be18b660be
      SPEC_REVISION: sha256:af72b5d0c6757c4051f3cb7dc7c2e3de49cdcda77b6c863d1ad1e07a2d1acc1d
      PACKET_DIGEST: sha256:8e51c05fde9d22dd024745a7d482850727dca22f7fcd64b283b97a2656717d3d
      PACKET_FILE_SHA256: 83578cf8a0ce3b463cfaeab55d973071ea2481ce6c2f43bd17a5b0aa902e2ead
      IMPL_DIFF_SHA256: c90ef50c6cf9bc423a37d80d41d620880c853beb267f9392969b9a5b1a023dde
      IMPL_FILE_LIST_SHA256: 9b071591440018ea7472d76cb1041212ffc252ea3bc093b35a4c175a0f064b96
      IMPL_REVIEW_SHA256: e59968f7f9e78dbd3d89c79b2ecdd2f16203354bff90eb3674142cd106bcfa48
      PR_CI_RUN: "35559515792"
      QUALIFICATION_RUN: "35559665726"
      MAIN_CI_RUN: "35559880747"
      DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
      OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
      EVIDENCE_BRANCH: evidence/sg-000026-verification
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Install pinned SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@5de7d6499bb0a9e3a191fc0934399cf099d1980a"

      - name: Generate and independently qualify native evidence
        shell: bash
        run: python .github/automation/sg26_evidence.py

      - name: Upload evidence-generation audit bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sg-000026-native-evidence-generation
          path: |
            /tmp/sg26-context-sources.json
            /tmp/sg26-workpacket.json
            /tmp/sg26-evidence-diffcipline.json
            /tmp/sg26-evidence-diffcipline.err
            /tmp/sg26-evidence-ocr.json
            /tmp/sg26-evidence-rules.json
            /tmp/sg26-evidence-review-prompt.txt
            /tmp/sg26-evidence-review-final.txt
            /tmp/sg26-evidence-summary.json
            .specgrain/evidence/SG-000026/*.json
          if-no-files-found: error
          retention-days: 30
