name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --offline

      - name: Clippy
        run: cargo clippy --workspace --all-targets --offline -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --offline

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          printf '%s\n' "$metadata"
          printf '%s' "$metadata" | grep -q '"name":"morize-core"'
          printf '%s' "$metadata" | grep -q '"dependencies":\[\]'
          test "$(grep -c '^\[\[package\]\]$' Cargo.lock)" -eq 1
          grep -q '^name = "morize-core"$' Cargo.lock

      - name: Diffcipline R2 proof
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          risk: R2
          run-verification: "true"


  prove-sg26-evidence-main:
    name: prove SG-000026 evidence main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      TARGET_MAIN: 19603b07bc0313b0a29676f6f41c95045b5720eb
      EVIDENCE_HEAD: 86dc3cdd84cc81cc014a81314092cd07b29f3763
      EVIDENCE_PR_CI_RUN: "35562039794"
      EVIDENCE_PATH: .specgrain/evidence/SG-000026/00886cf4d320750bfd5da6e47a3eccdfebd09512da364c7737d0b6f103a5316b.json
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheHalfMoon/Morize
          ref: 19603b07bc0313b0a29676f6f41c95045b5720eb
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical evidence and exact-main push CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$TARGET_MAIN"
          test -f "$EVIDENCE_PATH"

          python3 - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path(".specgrain/evidence/SG-000026/00886cf4d320750bfd5da6e47a3eccdfebd09512da364c7737d0b6f103a5316b.json").read_text(encoding="utf-8"))
          assert record["record_digest"] == "sha256:00886cf4d320750bfd5da6e47a3eccdfebd09512da364c7737d0b6f103a5316b"
          assert record["report"]["spec_id"] == "SG-000026"
          assert record["report"]["verified"] is True
          assert record["report"]["issues"] == []
          print("CANONICAL_EVIDENCE_RECORD=PASS")
          PY

          RUN_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&branch=main&per_page=50" \
              --jq ".workflow_runs[] | select(.name == \"ci\" and .head_sha == \"$TARGET_MAIN\") | .id" \
              | head -n 1
          )"
          test -n "$RUN_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$TARGET_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .event)" = "push"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status)" = "completed"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = "success"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/main-ci-jobs.json
          python3 - "$RUN_ID" <<'PY'
          import json
          import sys

          run_id = sys.argv[1]
          data = json.load(open("/tmp/main-ci-jobs.json", encoding="utf-8"))
          required = {
              "verify (ubuntu-latest)",
              "verify (macos-latest)",
              "verify (windows-latest)",
          }
          observed = {
              job["name"]: job["conclusion"]
              for job in data["jobs"]
              if job["name"] in required
          }
          assert set(observed) == required, observed
          assert all(value == "success" for value in observed.values()), observed
          print(f"MAIN_CI_RUN={run_id}")
          print("MAIN_CI_UBUNTU=PASS")
          print("MAIN_CI_MACOS=PASS")
          print("MAIN_CI_WINDOWS=PASS")
          PY

          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_PR_CI_RUN" --jq .head_sha)" = "$EVIDENCE_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_PR_CI_RUN" --jq .event)" = "pull_request"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_PR_CI_RUN" --jq .status)" = "completed"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_PR_CI_RUN" --jq .conclusion)" = "success"
          echo "SG26_CANONICAL_PROOF=PASS"
