name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --offline

      - name: Clippy
        run: cargo clippy --workspace --all-targets --offline -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --offline

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          printf '%s\n' "$metadata"
          printf '%s' "$metadata" | grep -q '"name":"morize-core"'
          printf '%s' "$metadata" | grep -q '"dependencies":\[\]'
          test "$(grep -c '^\[\[package\]\]$' Cargo.lock)" -eq 1
          grep -q '^name = "morize-core"$' Cargo.lock

      - name: Diffcipline R2 proof
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          risk: R2
          run-verification: "true"
