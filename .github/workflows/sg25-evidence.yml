name: sg25-evidence

on:
  push:
    branches:
      - automation/sg-000025-evidence

permissions:
  contents: write
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Install pinned SpecGrain
        shell: bash
        env:
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
        run: |
          python -m pip install --disable-pip-version-check --quiet "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

      - name: Generate and qualify SG-000025 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL_MAIN: 478239655cc34265956ec4da9db4bde9a509e57c
          PACKET_BASE: 788bc7129ce815bc31888be58ebc95408eeb7ea1
          IMPL_HEAD: 5c745e16481a3dea2bb9b7e6df65a49cdbac2f57
          SPEC_REVISION: sha256:26514df5919182465e4eb163e774bdddfe556bec116856ba05215e8add7f35e6
          PACKET_DIGEST: sha256:d80b3274faa583f0d9575da54d2f86fd803e2c2ce79b64b048ec051350ca9952
          PACKET_FILE_SHA256: 0cb7071d373f3d0ce1a78cf6e7ff1bae6666affe863db2e6faf45bc36eba8529
          IMPL_DIFF_SHA256: 78a2a0cf6604b2a9918df84d4357fb91eef0b0dee6a1172add2f18f1217c3229
          IMPL_FILE_LIST_SHA256: e6852a06832c0ba7dd973c64ff259d86d755f71703a88ecb34b879f3e86b990d
          IMPL_REVIEW_SHA256: e8960bdbb326448ec6854631d4547aad64354a3b7bb485a77e347b7dae549932
          PR_CI_RUN: "35532387146"
          QUALIFICATION_RUN: "35532407484"
          MAIN_CI_RUN: "35532566576"
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
          EVIDENCE_BRANCH: evidence/sg-000025-verification
        run: python .github/automation/sg25_evidence.py
