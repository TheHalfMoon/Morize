name: sg20-authoring

on:
  push:
    branches:
      - automation/sg-000020-authoring

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Author and qualify SG-000020 planning branch
        shell: bash
        env:
          PLAN_BRANCH: plan/sg-000020-relation-edge-class
          BASE_MAIN: 7551ef18458470db2d5bbfbcb76adb17315a057e
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          if git ls-remote --exit-code origin "refs/heads/$PLAN_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $PLAN_BRANCH" >&2
            exit 2
          fi

          git switch -C "$PLAN_BRANCH" origin/main
          git config user.name "Gocceri"
          git config user.email "azialshehri@gmail.com"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . | tee /tmp/sg20-base-check.json
          specgrain prove --json SG-000011 . | tee /tmp/sg20-sg11-proof.json
          specgrain prove --json SG-000019 . | tee /tmp/sg20-sg19-proof.json
          python - <<'PY'
          import json, subprocess
          p11=json.load(open('/tmp/sg20-sg11-proof.json'))
          p19=json.load(open('/tmp/sg20-sg19-proof.json'))
          assert p11['verified'] is True
          assert p11['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          assert p19['verified'] is True
          assert p19['latest_record_digest']=='sha256:5f162f7283d2dd29ab35c8de2c79fd27af10b943fe8ba7e1c8f3e81ee2261e1f'
          subprocess.run(['git','merge-base','--is-ancestor','b54879d7c04ba914997f14034c3c1b262b9629f6','7551ef18458470db2d5bbfbcb76adb17315a057e'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor','32e9783f9297e7f1c6f907d89aa78dda0ff02353','7551ef18458470db2d5bbfbcb76adb17315a057e'],check=True)
          print('SG-000011 prerequisite: PASS')
          print('SG-000019 prerequisite: PASS')
          PY

          specgrain draft             --title "Add relation edge class primitive"             --outcome "morize-core exposes one dependency-free closed RelationEdgeClass enum with exactly Explicit and Inferred as fixed by docs/DATA_MODEL.md, without defining relation endpoints, evidence sufficiency, inference thresholds, graph behavior, authorization, serialization, persistence, or policy effects."             --rationale "docs/DATA_MODEL.md fixes every MemoryRelation edge_class as explicit or inferred, and MZ-PROV-005 requires inferred graph relationships to identify their inference/evidence class. This Grain adds only the typed edge-class distinction so later relation structure and inference-policy Grains can build on a bounded primitive without inventing thresholds or graph semantics."             --parent SG-000010             --json . | tee /tmp/sg20-draft.json

          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.specgrain/specs/SG-000020.json')
          data=json.loads(path.read_text())
          data['metadata'] = {
            'method': {
              'control': 'Implementation is limited to one dependency-free closed in-memory RelationEdgeClass enum, focused tests, and morize-core re-exports. No relation endpoints, evidence references, engine identity, confidence, inference thresholds, graph behavior, authorization, serialization, persistence, or third-party dependency is authorized.',
              'review_separation': 'An independent semantic reviewer must review the exact implementation head, exact Explicit/Inferred fidelity, closed-vocabulary correctness, absence of inference-policy/authority/graph/wire semantics, scope containment, and required evidence separately from the implementing agent before acceptance.',
              'rollback': 'Revert the relation-edge-class implementation commits; no persisted format, graph state, inference policy, authorization rule, or user data depends on this Grain.'
            },
            'morize': {
              'proof_prerequisites': [
                {
                  'implementation_revision': 'b54879d7c04ba914997f14034c3c1b262b9629f6',
                  'record_digest': 'sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9',
                  'spec_id': 'SG-000011',
                  'spec_revision': 'sha256:0c609888d253ab94487f9e1bdd2e5370f991321d57269f0b237d778ac30f129d'
                },
                {
                  'implementation_revision': '32e9783f9297e7f1c6f907d89aa78dda0ff02353',
                  'record_digest': 'sha256:5f162f7283d2dd29ab35c8de2c79fd27af10b943fe8ba7e1c8f3e81ee2261e1f',
                  'spec_id': 'SG-000019',
                  'spec_revision': 'sha256:0628d10f31cef46fd9e0c11fcd9fe530112d617c164d573c9171e7f5f92ae04a'
                }
              ]
            }
          }
          path.write_text(json.dumps(data,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

          git add .specgrain/specs/SG-000010.json .specgrain/specs/SG-000020.json
          git diff --cached --check
          git commit -s -m "specgrain: draft relation edge class Grain"

          specgrain shape SG-000020             --scope-in "Define public closed RelationEdgeClass with exactly Explicit and Inferred, matching docs/DATA_MODEL.md edge_class = explicit | inferred."             --scope-in "Keep both variants fieldless and derive only Clone, Copy, Debug, PartialEq, Eq, and Hash so edge class is typed without defining ordering, textual/numeric encoding, evidence sufficiency, confidence, or policy semantics."             --scope-in "Treat Explicit and Inferred as descriptive provenance classification only; neither value itself grants authority, proves truth, establishes evidence sufficiency, authorizes mutation, or triggers graph behavior."             --scope-in "Add standard-library-only focused tests covering both values, distinct equality/hash semantics, and Copy behavior without serialization or parser contracts."             --scope-out "A MemoryRelation struct, RelationId composition, from_ref/to_ref endpoints, evidence_refs, engine identity, confidence, policy revision binding, or inference/evidence thresholds."             --scope-out "Graph traversal or mutation, relationship discovery, inference engines, conflict/supersession policy, truth/authority semantics, authorization, or any behavior inferred merely from RelationEdgeClass."             --scope-out "Display/FromStr, parsers, serde or other serialization integration, numeric repr/discriminants, persisted or wire encoding, configuration formats, migrations, storage, retrieval, or domain-record integration."             --scope-out "Any third-party runtime, build, or test dependency."             --acceptance "morize-core exports RelationEdgeClass from the existing relation module with exactly Explicit and Inferred as current variants and no additional current edge class."             --acceptance "RelationEdgeClass is a closed vocabulary for this Grain and is not marked non_exhaustive; future edge-class expansion requires a separate compatibility-governed Grain."             --acceptance "Both RelationEdgeClass variants are fieldless, and neither Explicit nor Inferred defines evidence sufficiency, truth, authority, graph mutation, memory mutation, or authorization behavior."             --acceptance "RelationEdgeClass supports Clone, Copy, Debug, PartialEq, Eq, and Hash; focused tests exercise both variants and confirm distinct value semantics without defining an ordering contract."             --acceptance "The implementation defines no relation endpoints, evidence references, engine identity, confidence, inference/evidence thresholds, graph behavior, Display, FromStr, parser, serde integration, numeric repr/discriminants, or wire/persistence format."             --acceptance "cargo fmt --all -- --check passes on the exact implementation head."             --acceptance "cargo check --workspace --all-targets --offline passes on the exact implementation head."             --acceptance "cargo clippy --workspace --all-targets --offline -- -D warnings passes on the exact implementation head."             --acceptance "cargo test --workspace --all-targets --offline passes and includes focused tests for both relation edge classes and required value semantics."             --acceptance "Cargo manifests and Cargo.lock are unchanged; the Grain admits no runtime, build, or test dependency."             --acceptance "GitHub Actions passes Ubuntu, macOS, and Windows on the exact implementation head before acceptance."             --acceptance "An independent semantic reviewer reviews the exact implementation head for exact Explicit/Inferred fidelity, closed-vocabulary correctness, absence of inference-policy/authority/graph/wire semantics, scope containment, and required evidence."             --acceptance "ADR-0004 proof prerequisites for SG-000011 and SG-000019 revalidate against the exact WorkPacket baseline before execution."             --acceptance "The implementation changes no path outside crates/morize-core/src/relation.rs and crates/morize-core/src/lib.rs."             --risk-level medium             --recovery "Revert the relation-edge-class implementation commits; no persisted format, graph state, inference policy, authorization rule, or user data has been written by this Grain."             --context-budget 11000             --context-estimate 6200             --change-surface "crates/morize-core/src/relation.rs"             --change-surface "crates/morize-core/src/lib.rs"             --evidence rollback             --evidence independent-review             --evidence E-PROOF-PREREQUISITE-SG000011             --evidence E-PROOF-PREREQUISITE-SG000019             --evidence E-EDGE-CLASS-BASELINE             --evidence E-EDGE-CLASS-CLOSED             --evidence E-EDGE-CLASS-FIELDLESS             --evidence E-EDGE-CLASS-NO-INFERENCE-POLICY             --evidence E-EDGE-CLASS-VALUE-SEMANTICS             --evidence E-EDGE-CLASS-NO-DEPENDENCIES             --evidence E-RUST-FMT             --evidence E-RUST-CHECK-OFFLINE             --evidence E-RUST-CLIPPY-OFFLINE             --evidence E-RUST-TEST-OFFLINE             --evidence E-CROSS-PLATFORM-CI             --minimality-choice native             --minimality-rationale "One standard-library-only two-variant enum in the existing relation module is the narrowest implementation of the already-fixed explicit/inferred distinction while deferring relation structure, thresholds, inference behavior, serialization, and persistence."             --safety-status requirements-defined             --safety-requirement "RelationEdgeClass is descriptive provenance classification only; Inferred must not itself imply evidence sufficiency, truth, authority, authorization, or permission to mutate memory or graph state."             --json . | tee /tmp/sg20-shape.json

          git add .specgrain/specs/SG-000020.json
          git diff --cached --check
          git commit -s -m "specgrain: shape relation edge class contract"

          specgrain refine SG-000020 --json . | tee /tmp/sg20-refine.json
          git add .specgrain/specs/SG-000020.json
          git diff --cached --check
          git commit -s -m "specgrain: refine relation edge class Grain"

          specgrain grain SG-000020 --json . | tee /tmp/sg20-grain.json
          rm -rf .specgrain/tmp
          git add .specgrain/specs/SG-000020.json
          git diff --cached --check
          git commit -s -m "specgrain: promote relation edge class contract to Grain"

          PLAN_HEAD="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          specgrain check --json . | tee /tmp/sg20-check.json
          specgrain next --json . | tee /tmp/sg20-next.json

          python - <<'PY'
          import json
          check=json.load(open('/tmp/sg20-check.json'))
          nxt=json.load(open('/tmp/sg20-next.json'))
          assert check['valid'] is True and check['issues']==[]
          assert 'SG-000020' in nxt['eligible']
          print('SpecGrain final qualification: PASS')
          PY

          SPEC_REVISION="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/sg20-grain.json'))['revision_digest'])
          PY
          )"
          DIFF_SHA256="$(git diff "$BASE_MAIN...$PLAN_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sha256sum | awk '{print $1}')"
          test "$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sort | tr '\n' ' ')" = ".specgrain/specs/SG-000010.json .specgrain/specs/SG-000020.json "

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg20-plan-diffcipline.json 2>/tmp/sg20-plan-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg20-plan-diffcipline.json | awk '{print $1}')"
          python - <<'PY'
          import json
          lines=[line for line in open('/tmp/sg20-plan-diffcipline.json') if line.strip()]
          x=json.loads(lines[-1])
          assert x['verdict']=='PASS'
          assert x['changed_files']==2
          assert x['scope_violations']==[]
          assert all(v['state']=='PASS' for v in x['verification'])
          print('Diffcipline exact-head: PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$PLAN_HEAD"             > /tmp/sg20-plan-ocr-preview.json
          python - <<'PY'
          import json,subprocess
          x=json.load(open('/tmp/sg20-plan-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=[f['path'] for f in x['reviewable_files']]
          assert sorted(paths)==['.specgrain/specs/SG-000010.json','.specgrain/specs/SG-000020.json']
          with open('/tmp/sg20-plan-ocr-rules.json','w') as out:
              subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*paths],check=True,stdout=out)
          groups=json.load(open('/tmp/sg20-plan-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==sorted(paths)
          print('Alibaba accounting: 2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          export PLAN_HEAD SPEC_REVISION DIFF_SHA256 FILE_LIST_SHA256 DIFFCIPLINE_SHA256 BASE_MAIN
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from gradio_client import Client
          spec=Path('.specgrain/specs/SG-000020.json').read_text()
          head=os.environ['PLAN_HEAD']; base=os.environ['BASE_MAIN']
          prompt=f"""Independent semantic PLANNING review of Morize SG-000020. Return final structured review only; do not expose chain-of-thought or tool traces.
          
          REVIEW_HEAD={head}
          BASE_MAIN={base}
          SPEC_REVISION={os.environ['SPEC_REVISION']}
          DIFF_SHA256={os.environ['DIFF_SHA256']}
          FILE_LIST_SHA256={os.environ['FILE_LIST_SHA256']}
          DIFFCIPLINE_SHA256={os.environ['DIFFCIPLINE_SHA256']}
          Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.
          Exact changed paths: .specgrain/specs/SG-000010.json and .specgrain/specs/SG-000020.json.
          SpecGrain check valid=true issues=[]; SG-000020 eligible=true.
          SG-000011 prerequisite: verified=true, record=sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9.
          SG-000019 prerequisite: verified=true, record=sha256:5f162f7283d2dd29ab35c8de2c79fd27af10b943fe8ba7e1c8f3e81ee2261e1f.
          
          Repository planning authority:
          - docs/DATA_MODEL.md fixes MemoryRelation edge_class = explicit | inferred.
          - MZ-PROV-005 requires inferred graph relationships to identify their inference/evidence class.
          - SG-000019 intentionally excluded edge class, so this Grain fills exactly that deferred primitive.
          - This Grain must not define relation endpoints, inference thresholds, evidence sufficiency, graph behavior, authority, serialization, or persistence.
          
          Review goals:
          1. Exact Explicit/Inferred fidelity with no third current edge class.
          2. Closed-vocabulary choice is coherent with edge_class = explicit | inferred.
          3. Both variants fieldless and descriptive only.
          4. Inferred must not imply evidence sufficiency, truth, authority, authorization, graph mutation, or memory mutation.
          5. No endpoints, evidence refs, engine identity, confidence, thresholds, graph traversal/mutation, parser, serialization, numeric, wire, or persistence semantics.
          6. Derives limited to Clone, Copy, Debug, PartialEq, Eq, Hash; no ordering.
          7. Exact two-file planning scope, rollback, both proof prerequisites, and acceptance/evidence coherence.
          8. No third-party implementation dependency.
          
          SG-000020 Grain:
          {spec}
          
          Return exactly:
          REVIEW_HEAD
          {head}
          REVIEW_KIND
          SG-000020_PLANNING
          CRITICAL = NONE
          HIGH = NONE
          MEDIUM = NONE
          LOW = NONE
          FINDINGS
          - NONE
          FINAL_GATE = PASS
          Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.
          """
          Path('/tmp/sg20-plan-north-prompt.txt').write_text(prompt)
          raw=Client('CohereLabs/North-Mini-Code-1.0',verbose=False).predict(prompt,'Rust','[]','{}',api_name='/chat')
          obj=json.loads(raw) if isinstance(raw,str) else raw
          content=''
          for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
              if msg.get('role')=='assistant':
                  content=msg.get('content','')
          final=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
          checks=[
              f'REVIEW_HEAD\n{head}',
              'REVIEW_KIND\nSG-000020_PLANNING',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              print(final)
              raise SystemExit('independent semantic review did not qualify')
          Path('/tmp/sg20-plan-north-final.md').write_text(final+'\n')
          summary={
              'base_main':base,
              'planning_head':head,
              'spec_revision':os.environ['SPEC_REVISION'],
              'diff_sha256':os.environ['DIFF_SHA256'],
              'file_list_sha256':os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256':os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256':hashlib.sha256((final+'\n').encode()).hexdigest(),
          }
          Path('/tmp/sg20-authoring-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

          git push origin "HEAD:refs/heads/$PLAN_BRANCH"

          {
            echo "## SG-000020 authoring qualification"
            echo
            cat /tmp/sg20-authoring-summary.json
            echo
            echo "SpecGrain: PASS"
            echo "Diffcipline: PASS"
            echo "Alibaba accounting: 2/2"
            echo "Independent semantic planning review: PASS"
            echo "Pushed clean branch: $PLAN_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
