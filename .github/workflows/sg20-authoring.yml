name: sg20-canonical-proof

on:
  push:
    branches:
      - automation/sg-000020-authoring

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prove SG-000020 on exact canonical main
        shell: bash
        env:
          CANONICAL_MAIN: f79e1bd91aa39760d283eb326a17a0ea08e0eeba
          EXPECTED_RECORD: sha256:0980253c079ec58609e40d76e35ec42a3f10d3a6a5570d045c04aff19e95fa7d
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$CANONICAL_MAIN"
          git checkout --detach origin/main
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg20-canonical-check.json
          specgrain prove --json SG-000020 . > /tmp/sg20-canonical-proof.json

          python - <<'PY'
          import json, os
          from pathlib import Path
          check=json.load(open('/tmp/sg20-canonical-check.json'))
          proof=json.load(open('/tmp/sg20-canonical-proof.json'))
          spec=json.loads(Path('.specgrain/specs/SG-000020.json').read_text())
          assert check['valid'] is True and check['issues']==[]
          assert proof['verified'] is True
          assert proof['record_count']==1
          assert proof['latest_record_digest']==os.environ['EXPECTED_RECORD']
          assert spec['state']=='GRAIN'
          print('CANONICAL_MAIN='+os.environ['CANONICAL_MAIN'])
          print('SG20_VERIFIED=true')
          print('SG20_RECORD_COUNT=1')
          print('SG20_LATEST_RECORD='+proof['latest_record_digest'])
          print('SG20_SPEC_STATE=GRAIN')
          print('SPEC_GRAIN_CHECK=PASS')
          PY
