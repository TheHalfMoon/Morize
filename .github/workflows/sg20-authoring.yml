name: sg20-implementation

on:
  push:
    branches:
      - automation/sg-000020-authoring

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Implement and qualify SG-000020
        shell: bash
        env:
          IMPL_BRANCH: impl/sg-000020-relation-edge-class
          BASE_MAIN: 2f84412f65a4d3a3b07d884bc1870f70135b19ff
          SPEC_REVISION: sha256:fd7230363b32044967180106592bc371dd688ddad7c9182a45b8fbe78aedaab1
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          if git ls-remote --exit-code origin "refs/heads/$IMPL_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $IMPL_BRANCH" >&2
            exit 2
          fi

          git switch -C "$IMPL_BRANCH" origin/main
          git config user.name "Gocceri"
          git config user.email "azialshehri@gmail.com"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg20-impl-base-check.json
          specgrain prove --json SG-000011 . > /tmp/sg20-impl-sg11-proof.json
          specgrain prove --json SG-000019 . > /tmp/sg20-impl-sg19-proof.json

          python - <<'PY'
          import json, subprocess
          check=json.load(open('/tmp/sg20-impl-base-check.json'))
          p11=json.load(open('/tmp/sg20-impl-sg11-proof.json'))
          p19=json.load(open('/tmp/sg20-impl-sg19-proof.json'))
          assert check['valid'] is True and check['issues']==[]
          assert p11['verified'] is True
          assert p11['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          assert p19['verified'] is True
          assert p19['latest_record_digest']=='sha256:5f162f7283d2dd29ab35c8de2c79fd27af10b943fe8ba7e1c8f3e81ee2261e1f'
          subprocess.run(['git','merge-base','--is-ancestor','b54879d7c04ba914997f14034c3c1b262b9629f6','2f84412f65a4d3a3b07d884bc1870f70135b19ff'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor','32e9783f9297e7f1c6f907d89aa78dda0ff02353','2f84412f65a4d3a3b07d884bc1870f70135b19ff'],check=True)
          print('SG-000011 prerequisite: PASS')
          print('SG-000019 prerequisite: PASS')
          PY

          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          base='2f84412f65a4d3a3b07d884bc1870f70135b19ff'

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()

          def section(path,start,end):
              text=Path(path).read_text()
              a=text.index(start)
              b=text.index(end,a) if end else len(text)
              return text[a:b]

          selections=[
              ('sg20-grain','.specgrain/specs/SG-000020.json',Path('.specgrain/specs/SG-000020.json').read_text(),
               'Exact GRAIN contract, acceptance criteria, proof prerequisites, change surface, and evidence requirements.',100),
              ('data-model-memory-relation','docs/DATA_MODEL.md',
               section('docs/DATA_MODEL.md','## 12. MemoryRelation','## 13. DecisionEnvelope'),
               'Canonical MemoryRelation section fixing relation_type and edge_class = explicit | inferred.',90),
              ('requirements-provenance','docs/REQUIREMENTS.md',
               section('docs/REQUIREMENTS.md','### MZ-PROV-005','### MZ-PROV-006'),
               'Canonical MZ-PROV-005 requirement for explainable inferred relation class.',85),
              ('proof-prerequisites','docs/adr/0004-verified-proof-prerequisites.md',
               Path('docs/adr/0004-verified-proof-prerequisites.md').read_text(),
               'Canonical proof-prerequisite policy used by this Grain.',80),
              ('relation-module','crates/morize-core/src/relation.rs',
               Path('crates/morize-core/src/relation.rs').read_text(),
               'Exact current relation vocabulary module that the authorized implementation extends.',70),
              ('core-export-surface','crates/morize-core/src/lib.rs',
               Path('crates/morize-core/src/lib.rs').read_text(),
               'Exact current morize-core export surface that the authorized implementation may extend.',60),
          ]

          records=[]
          for source_id,path,data,reason,priority in selections:
              encoded=data.encode()
              records.append({
                  'source_id':source_id,
                  'provenance':f'git:{base}:{path}',
                  'selection_reason':reason,
                  'revision':f'git:{blob(path)}',
                  'size_bytes':len(encoded),
                  'token_cost':(len(encoded)+3)//4,
                  'requirement':'required',
                  'priority':priority,
              })
          total=sum(r['token_cost'] for r in records)
          assert total <= 11000
          Path('/tmp/sg20-context-sources.json').write_text(
              json.dumps(records,indent=2,sort_keys=True,ensure_ascii=False)+'\n'
          )
          print('CONTEXT_SOURCE_COUNT='+str(len(records)))
          print('CONTEXT_TOKEN_TOTAL='+str(total))
          PY

          specgrain packet SG-000020 .             --context-sources /tmp/sg20-context-sources.json             --json > /tmp/sg20-workpacket.json

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/sg20-workpacket.json')
          x=json.loads(p.read_text())
          assert x['spec_id']=='SG-000020'
          assert x['spec_revision']=='sha256:fd7230363b32044967180106592bc371dd688ddad7c9182a45b8fbe78aedaab1'
          assert x['method']=='quick'
          assert sorted(x['authorized_change_surface'])==[
              'crates/morize-core/src/lib.rs',
              'crates/morize-core/src/relation.rs',
          ]
          assert len(x['context_sources'])==6
          total=sum(s['token_cost'] for s in x['context_sources'])
          assert total <= 11000
          print('PACKET_DIGEST='+x['packet_digest'])
          print('WORKPACKET_FILE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('CONTEXT_SOURCE_COUNT='+str(len(x['context_sources'])))
          print('CONTEXT_TOKEN_TOTAL='+str(total))
          PY

          python - <<'PY'
          from pathlib import Path

          relation=Path('crates/morize-core/src/relation.rs')
          text=relation.read_text()

          old_module='''//! This module defines only the initial in-memory relation vocabulary fixed by
          //! docs/DATA_MODEL.md. It does not define relation endpoints, explicit/inferred
          //! edge class, evidence sufficiency, truth, authority, graph traversal or
          //! mutation, memory mutation, serialization, persistence, or transport behavior.
          '''
          new_module='''//! This module defines only the initial in-memory relation vocabulary and
          //! explicit/inferred edge-class distinction fixed by docs/DATA_MODEL.md. It does
          //! not define relation endpoints, evidence sufficiency, inference thresholds,
          //! truth, authority, graph traversal or mutation, memory mutation, serialization,
          //! persistence, or transport behavior.
          '''
          assert old_module in text
          text=text.replace(old_module,new_module)

          marker='''#[cfg(test)]
          mod tests {
          '''
          edge='''/// Whether a memory relation was recorded explicitly or inferred.
          ///
          /// Edge class is descriptive provenance classification only. In particular,
          /// `Inferred` does not establish evidence sufficiency, truth, authority,
          /// authorization, or permission to mutate memory or graph state.
          #[derive(Clone, Copy, Debug, Eq, Hash, PartialEq)]
          pub enum RelationEdgeClass {
              /// The relation was recorded explicitly.
              Explicit,
              /// The relation was inferred.
              Inferred,
          }

          '''
          assert marker in text
          text=text.replace(marker,edge+marker)

          text=text.replace(
              '    use super::MemoryRelationType;\n',
              '    use super::{MemoryRelationType, RelationEdgeClass};\n'
          )

          insert='''

              #[test]
              fn relation_edge_classes_are_distinct_hashable_values() {
                  let classes = [RelationEdgeClass::Explicit, RelationEdgeClass::Inferred];

                  assert_ne!(classes[0], classes[1]);

                  let unique: HashSet<_> = classes.into_iter().collect();
                  assert_eq!(unique.len(), 2);
              }

              #[test]
              fn relation_edge_class_is_copy() {
                  let original = RelationEdgeClass::Inferred;
                  let copied = original;

                  assert_eq!(original, copied);
              }
          '''
          end='''    fn memory_relation_type_is_copy() {
                  let original = MemoryRelationType::RelatedTo;
                  let copied = original;

                  assert_eq!(original, copied);
              }
          }
          '''
          assert end in text
          replacement='''    fn memory_relation_type_is_copy() {
                  let original = MemoryRelationType::RelatedTo;
                  let copied = original;

                  assert_eq!(original, copied);
              }'''+insert+'''}
          '''
          text=text.replace(end,replacement)
          relation.write_text(text)

          lib=Path('crates/morize-core/src/lib.rs')
          lib_text=lib.read_text()
          assert 'pub use relation::MemoryRelationType;' in lib_text
          lib_text=lib_text.replace(
              'pub use relation::MemoryRelationType;',
              'pub use relation::{MemoryRelationType, RelationEdgeClass};'
          )
          lib.write_text(lib_text)
          PY

          test "$(git diff --name-only | sort | tr '\n' ' ')" = "crates/morize-core/src/lib.rs crates/morize-core/src/relation.rs "
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline
          cargo clippy --workspace --all-targets --offline -- -D warnings
          cargo test --workspace --all-targets --offline 2>&1 | tee /tmp/sg20-tests.txt
          python - <<'PY'
          import re
          text=open('/tmp/sg20-tests.txt').read()
          counts=[int(x) for x in re.findall(r'test result: ok\. (\d+) passed;',text)]
          assert counts
          total=sum(counts)
          print('LOCAL_TESTS_PASSED='+str(total))
          PY

          git add crates/morize-core/src/relation.rs crates/morize-core/src/lib.rs
          git diff --cached --check
          git commit -s -m "feat: add relation edge class primitive"

          IMPL_HEAD="$(git rev-parse HEAD)"
          IMPL_TREE="$(git rev-parse HEAD^{tree})"
          DIFF_SHA256="$(git diff "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sort | tr '\n' ' ')" = "crates/morize-core/src/lib.rs crates/morize-core/src/relation.rs "
          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" -- Cargo.toml Cargo.lock '*/Cargo.toml' | wc -l | tr -d ' ')" = "0"
          test -z "$(git status --porcelain)"

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg20-impl-diffcipline.json 2>/tmp/sg20-impl-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg20-impl-diffcipline.json | awk '{print $1}')"
          export DIFFCIPLINE_SHA256
          python - <<'PY'
          import json
          lines=[line for line in open('/tmp/sg20-impl-diffcipline.json') if line.strip()]
          x=json.loads(lines[-1])
          assert x['verdict']=='PASS'
          assert x['changed_files']==2
          assert x['scope_violations']==[]
          assert all(v['state']=='PASS' for v in x['verification'])
          print('Diffcipline exact committed head: PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$IMPL_HEAD"             > /tmp/sg20-impl-ocr-preview.json
          python - <<'PY'
          import json,subprocess
          x=json.load(open('/tmp/sg20-impl-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=[f['path'] for f in x['reviewable_files']]
          assert sorted(paths)==['crates/morize-core/src/lib.rs','crates/morize-core/src/relation.rs']
          with open('/tmp/sg20-impl-ocr-rules.json','w') as out:
              subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*paths],check=True,stdout=out)
          groups=json.load(open('/tmp/sg20-impl-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==sorted(paths)
          print('Alibaba accounting: 2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          export IMPL_HEAD IMPL_TREE DIFF_SHA256 FILE_LIST_SHA256 BASE_MAIN SPEC_REVISION
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          from gradio_client import Client

          packet=json.loads(Path('/tmp/sg20-workpacket.json').read_text())
          src=Path('crates/morize-core/src/relation.rs').read_text()
          lib=Path('crates/morize-core/src/lib.rs').read_text()
          test_text=Path('/tmp/sg20-tests.txt').read_text()
          counts=[int(x) for x in re.findall(r'test result: ok\. (\d+) passed;',test_text)]
          test_total=sum(counts)
          head=os.environ['IMPL_HEAD']

          prompt='\n'.join([
              'Independent semantic IMPLEMENTATION review of Morize SG-000020. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={head}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={os.environ["SPEC_REVISION"]}',
              f'PACKET_DIGEST={packet["packet_digest"]}',
              f'DIFF_SHA256={os.environ["DIFF_SHA256"]}',
              f'FILE_LIST_SHA256={os.environ["FILE_LIST_SHA256"]}',
              f'DIFFCIPLINE_SHA256={os.environ["DIFFCIPLINE_SHA256"]}',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              'Exact changed paths: crates/morize-core/src/relation.rs and crates/morize-core/src/lib.rs.',
              'Cargo manifests and Cargo.lock unchanged.',
              f'Local exact-head workspace tests: {test_total} passed.',
              'Exact committed-head Diffcipline PASS: changed_files=2, scope_violations=[], all configured verification commands PASS.',
              '',
              'Canonical contract:',
              '- RelationEdgeClass must contain exactly Explicit and Inferred.',
              '- The enum is closed for this Grain and must NOT be #[non_exhaustive].',
              '- Both variants are fieldless descriptive provenance classification only.',
              '- Inferred must not establish evidence sufficiency, truth, authority, authorization, graph mutation, or memory mutation.',
              '- Derives are limited to Clone, Copy, Debug, PartialEq, Eq, Hash; no ordering.',
              '- No endpoints, evidence refs, engine identity, confidence, inference/evidence thresholds, graph behavior, parser, serialization, numeric repr/discriminants, wire/persistence, storage/retrieval, or third-party dependency.',
              '- Authorized implementation scope is only relation.rs and lib.rs.',
              '- SG-000011 and SG-000019 proof prerequisites are verified at the exact WorkPacket baseline.',
              '',
              'Review for exact contract fidelity, meaningful focused tests, preservation of MemoryRelationType semantics, scope containment, and absence of invented inference-policy/authority/graph/wire semantics.',
              '',
              'relation.rs:',
              src,
              '',
              'lib.rs:',
              lib,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              head,
              'REVIEW_KIND',
              'SG-000020_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.',
          ])

          Path('/tmp/sg20-impl-north-prompt.txt').write_text(prompt)
          raw=Client('CohereLabs/North-Mini-Code-1.0',verbose=False).predict(prompt,'Rust','[]','{}',api_name='/chat')
          obj=json.loads(raw) if isinstance(raw,str) else raw
          content=''
          for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
              if msg.get('role')=='assistant':
                  content=msg.get('content','')
          final=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
          checks=[
              f'REVIEW_HEAD\n{head}',
              'REVIEW_KIND\nSG-000020_IMPLEMENTATION',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              print(final)
              raise SystemExit('independent semantic implementation review did not qualify')
          Path('/tmp/sg20-impl-north-final.md').write_text(final+'\n')

          summary={
              'base_main':os.environ['BASE_MAIN'],
              'implementation_head':head,
              'implementation_tree':os.environ['IMPL_TREE'],
              'spec_revision':os.environ['SPEC_REVISION'],
              'packet_digest':packet['packet_digest'],
              'workpacket_file_sha256':hashlib.sha256(Path('/tmp/sg20-workpacket.json').read_bytes()).hexdigest(),
              'context_source_count':len(packet['context_sources']),
              'context_token_total':sum(s['token_cost'] for s in packet['context_sources']),
              'local_tests_passed':test_total,
              'diff_sha256':os.environ['DIFF_SHA256'],
              'file_list_sha256':os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256':os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256':hashlib.sha256((final+'\n').encode()).hexdigest(),
          }
          Path('/tmp/sg20-implementation-summary.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$IMPL_BRANCH"

          {
            echo "## SG-000020 implementation qualification"
            echo
            cat /tmp/sg20-implementation-summary.json
            echo
            echo "SG-000011 prerequisite: PASS"
            echo "SG-000019 prerequisite: PASS"
            echo "Exact committed-head Diffcipline: PASS"
            echo "Alibaba accounting: 2/2"
            echo "Independent semantic implementation review: PASS"
            echo "Pushed clean branch: $IMPL_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
