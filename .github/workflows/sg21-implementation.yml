name: sg21-implementation

on:
  push:
    branches:
      - automation/sg-000021-implementation

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Implement and qualify SG-000021
        shell: bash
        env:
          BASE_MAIN: b9259e9ddcde53e0bdfa2c90c534265c51479420
          IMPL_BRANCH: impl/sg-000021-mutation-terminal-state
          SPEC_REVISION: sha256:9cd458e45be54fa361e1ac8654161ee8b5cf4a88a975b66e33d677de1f1501ad
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          if git ls-remote --exit-code origin "refs/heads/$IMPL_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $IMPL_BRANCH" >&2
            exit 2
          fi

          git checkout --detach "$BASE_MAIN"
          git config user.name "Gocceri"
          git config user.email "azialshehri@gmail.com"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg21-base-check.json
          specgrain prove --json SG-000011 . > /tmp/sg21-sg11-proof.json
          python - <<'PY'
          import json, os, subprocess
          check=json.load(open('/tmp/sg21-base-check.json'))
          proof=json.load(open('/tmp/sg21-sg11-proof.json'))
          assert check['valid'] is True and check['issues']==[]
          assert proof['verified'] is True
          assert proof['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          subprocess.run([
              'git','merge-base','--is-ancestor',
              'b54879d7c04ba914997f14034c3c1b262b9629f6',
              os.environ['BASE_MAIN']
          ],check=True)
          print('SG-000011 prerequisite: PASS')
          PY

          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          base='b9259e9ddcde53e0bdfa2c90c534265c51479420'

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()

          def section(path,start,end):
              text=Path(path).read_text()
              a=text.index(start)
              b=text.index(end,a) if end else len(text)
              return text[a:b]

          selections=[
              ('sg21-grain','.specgrain/specs/SG-000021.json',
               Path('.specgrain/specs/SG-000021.json').read_text(),
               'Exact GRAIN contract, acceptance criteria, proof prerequisite, change surface, and evidence requirements.',100),
              ('data-model-mutation-terminal','docs/DATA_MODEL.md',
               section('docs/DATA_MODEL.md','## 15. Mutation terminal states','## 16.'),
               'Canonical data-model section fixing the four planned mutation terminal states and UNKNOWN_OUTCOME non-success semantics.',95),
              ('requirements-reliability','docs/REQUIREMENTS.md',
               section('docs/REQUIREMENTS.md','## F. Persistence and reliability','## G. Identity, scope, and authorization'),
               'Canonical reliability requirements including MZ-REL-005 unknown-outcome behavior and adjacent deferred mutation concerns.',90),
              ('proof-prerequisites','docs/adr/0004-verified-proof-prerequisites.md',
               Path('docs/adr/0004-verified-proof-prerequisites.md').read_text(),
               'Canonical proof-prerequisite policy used by this Grain.',80),
              ('core-export-surface','crates/morize-core/src/lib.rs',
               Path('crates/morize-core/src/lib.rs').read_text(),
               'Exact current morize-core export surface that the authorized implementation may extend.',70),
          ]

          records=[]
          for source_id,path,data,reason,priority in selections:
              encoded=data.encode()
              records.append({
                  'source_id':source_id,
                  'provenance':f'git:{base}:{path}',
                  'selection_reason':reason,
                  'revision':f'git:{blob(path)}',
                  'size_bytes':len(encoded),
                  'token_cost':(len(encoded)+3)//4,
                  'requirement':'required',
                  'priority':priority,
              })
          total=sum(r['token_cost'] for r in records)
          assert total <= 11000
          Path('/tmp/sg21-context-sources.json').write_text(
              json.dumps(records,indent=2,sort_keys=True,ensure_ascii=False)+'\n'
          )
          print('CONTEXT_SOURCE_COUNT='+str(len(records)))
          print('CONTEXT_TOKEN_TOTAL='+str(total))
          PY

          specgrain packet SG-000021 .             --context-sources /tmp/sg21-context-sources.json             --json > /tmp/sg21-workpacket.json

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          x=json.load(open('/tmp/sg21-workpacket.json'))
          assert x['spec_id']=='SG-000021'
          assert x['spec_revision']==os.environ['SPEC_REVISION']
          assert len(x['context_sources'])==5
          print('WORKPACKET_DIGEST='+x['packet_digest'])
          print('WORKPACKET_FILE_SHA256='+hashlib.sha256(Path('/tmp/sg21-workpacket.json').read_bytes()).hexdigest())
          PY

          git switch -C "$IMPL_BRANCH" "$BASE_MAIN"

          cat > crates/morize-core/src/mutation.rs <<'RS'
          //! Baseline mutation terminal-state classifications for deterministic Morize core contracts.
          //!
          //! This module defines only the planned terminal-state vocabulary fixed by
          //! docs/DATA_MODEL.md. It does not define mutation records, state transitions,
          //! dependent-mutation blocking, reconciliation execution, retry/idempotency,
          //! compare-and-swap, serialization, persistence, or transport behavior.

          /// The current baseline mutation terminal-state vocabulary.
          ///
          /// This vocabulary is intentionally non-exhaustive because the canonical data
          /// model describes these as planned terminal semantics rather than a permanently
          /// closed public vocabulary.
          #[non_exhaustive]
          #[derive(Clone, Copy, Debug, Eq, Hash, PartialEq)]
          pub enum MutationTerminalState {
              /// The mutation is known to have committed.
              Committed,
              /// The mutation was rejected.
              Rejected,
              /// The mutation failed.
              Failed,
              /// Completion is ambiguous and must not be treated as success.
              ///
              /// Reconciliation and dependent-mutation blocking are intentionally outside
              /// this value type.
              UnknownOutcome,
          }

          #[cfg(test)]
          mod tests {
              use super::MutationTerminalState;
              use std::collections::HashSet;

              const ALL_CURRENT_TERMINAL_STATES: [MutationTerminalState; 4] = [
                  MutationTerminalState::Committed,
                  MutationTerminalState::Rejected,
                  MutationTerminalState::Failed,
                  MutationTerminalState::UnknownOutcome,
              ];

              #[test]
              fn all_four_current_terminal_states_are_distinct_hashable_values() {
                  for (index, state) in ALL_CURRENT_TERMINAL_STATES.iter().enumerate() {
                      for other in ALL_CURRENT_TERMINAL_STATES.iter().skip(index + 1) {
                          assert_ne!(state, other);
                      }
                  }

                  let unique: HashSet<_> = ALL_CURRENT_TERMINAL_STATES.into_iter().collect();
                  assert_eq!(unique.len(), 4);
              }

              #[test]
              fn mutation_terminal_state_is_copy() {
                  let original = MutationTerminalState::UnknownOutcome;
                  let copied = original;

                  assert_eq!(original, copied);
              }
          }
          RS

          python - <<'PY'
          from pathlib import Path
          path=Path('crates/morize-core/src/lib.rs')
          text=path.read_text()
          marker='pub mod identity;\n'
          assert marker in text
          text=text.replace(marker,marker+'pub mod mutation;\n',1)
          marker2='pub use identity::{\n'
          assert marker2 in text
          insert='pub use mutation::MutationTerminalState;\n'
          # place the re-export after the identity block, before relation.
          relation='pub use relation::{MemoryRelationType, RelationEdgeClass};\n'
          assert relation in text
          text=text.replace(relation,insert+relation,1)
          path.write_text(text)
          PY

          cargo fmt --all

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"

          set +e
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg21-precommit-diffcipline.json 2>/tmp/sg21-precommit-diffcipline.err
          PRECOMMIT_EXIT=$?
          set -e
          PRECOMMIT_SHA256="$(sha256sum /tmp/sg21-precommit-diffcipline.json | awk '{print $1}')"
          echo "PRECOMMIT_DIFFCIPLINE_EXIT=$PRECOMMIT_EXIT"
          echo "PRECOMMIT_DIFFCIPLINE_SHA256=$PRECOMMIT_SHA256"
          if [ "$PRECOMMIT_EXIT" -eq 0 ]; then
            echo "PRECOMMIT_DIFFCIPLINE_RESULT=PASS"
          else
            echo "PRECOMMIT_DIFFCIPLINE_RESULT=FAIL"
          fi

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline
          cargo clippy --workspace --all-targets --offline -- -D warnings
          cargo test --workspace --all-targets --offline 2>&1 | tee /tmp/sg21-tests.txt

          python - <<'PY'
          import re
          text=open('/tmp/sg21-tests.txt').read()
          counts=[int(x) for x in re.findall(r'test result: ok\. (\d+) passed;',text)]
          assert counts
          total=sum(counts)
          assert total==25, total
          print('LOCAL_TESTS_PASSED=25')
          PY

          test -z "$(git diff --name-only | grep -v -E '^(crates/morize-core/src/mutation.rs|crates/morize-core/src/lib.rs)$' || true)"
          test -f crates/morize-core/src/mutation.rs
          git add crates/morize-core/src/mutation.rs crates/morize-core/src/lib.rs
          git diff --cached --check
          git commit -s -m "feat: add mutation terminal state primitive"

          IMPL_HEAD="$(git rev-parse HEAD)"
          IMPL_TREE="$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sort | tr '\n' ' ')" = "crates/morize-core/src/lib.rs crates/morize-core/src/mutation.rs "

          DIFF_SHA256="$(git diff "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline
          cargo clippy --workspace --all-targets --offline -- -D warnings
          cargo test --workspace --all-targets --offline 2>&1 | tee /tmp/sg21-exact-tests.txt

          python - <<'PY'
          import re
          text=open('/tmp/sg21-exact-tests.txt').read()
          counts=[int(x) for x in re.findall(r'test result: ok\. (\d+) passed;',text)]
          assert counts and sum(counts)==25, counts
          print('EXACT_HEAD_TESTS_PASSED=25')
          PY

          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg21-impl-diffcipline.json 2>/tmp/sg21-impl-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg21-impl-diffcipline.json | awk '{print $1}')"
          python - <<'PY'
          import json
          lines=[line for line in open('/tmp/sg21-impl-diffcipline.json') if line.strip()]
          x=json.loads(lines[-1])
          assert x['verdict']=='PASS'
          assert x['changed_files']==2
          assert x['scope_violations']==[]
          assert all(v['state']=='PASS' for v in x['verification'])
          print('Diffcipline exact implementation head: PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$IMPL_HEAD"             > /tmp/sg21-impl-ocr-preview.json
          python - <<'PY'
          import json, subprocess
          x=json.load(open('/tmp/sg21-impl-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=[f['path'] for f in x['reviewable_files']]
          assert sorted(paths)==['crates/morize-core/src/lib.rs','crates/morize-core/src/mutation.rs']
          with open('/tmp/sg21-impl-ocr-rules.json','w') as out:
              subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*paths],check=True,stdout=out)
          groups=json.load(open('/tmp/sg21-impl-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==sorted(paths)
          print('Alibaba implementation accounting: 2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          export IMPL_HEAD IMPL_TREE DIFF_SHA256 FILE_LIST_SHA256 DIFFCIPLINE_SHA256 PRECOMMIT_EXIT PRECOMMIT_SHA256 BASE_MAIN
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from gradio_client import Client

          packet=json.loads(Path('/tmp/sg21-workpacket.json').read_text())
          mutation=Path('crates/morize-core/src/mutation.rs').read_text()
          lib=Path('crates/morize-core/src/lib.rs').read_text()
          head=os.environ['IMPL_HEAD']

          prompt='\n'.join([
              'Independent semantic IMPLEMENTATION review of Morize SG-000021. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={head}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={os.environ["SPEC_REVISION"]}',
              f'WORKPACKET_DIGEST={packet["packet_digest"]}',
              f'DIFF_SHA256={os.environ["DIFF_SHA256"]}',
              f'FILE_LIST_SHA256={os.environ["FILE_LIST_SHA256"]}',
              f'DIFFCIPLINE_SHA256={os.environ["DIFFCIPLINE_SHA256"]}',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              'Exact changed paths: crates/morize-core/src/lib.rs and crates/morize-core/src/mutation.rs.',
              'Exact-head local verification: fmt PASS; check offline PASS; clippy offline -D warnings PASS; tests 25/25 PASS.',
              'Cargo manifests and Cargo.lock unchanged.',
              '',
              'Contract review goals:',
              '1. Current variants exactly Committed, Rejected, Failed, UnknownOutcome.',
              '2. enum is #[non_exhaustive].',
              '3. all variants fieldless; derives only Clone, Copy, Debug, Eq, Hash, PartialEq; no ordering.',
              '4. UnknownOutcome is explicitly documented as ambiguous non-success.',
              '5. no method or behavior implements reconciliation or dependent-mutation blocking.',
              '6. no mutation record, transition engine/legality, retry/idempotency, CAS, crash recovery, parser, serialization, numeric representation, wire/persistence, transport, configuration, migration, storage, or retrieval semantics.',
              '7. scope is exactly mutation.rs + lib.rs with no dependency change.',
              '8. SG-000011 proof prerequisite remains the only proof prerequisite required by this Grain.',
              '',
              'WorkPacket:',
              json.dumps(packet,sort_keys=True),
              '',
              'mutation.rs:',
              mutation,
              '',
              'lib.rs:',
              lib,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              head,
              'REVIEW_KIND',
              'SG-000021_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.'
          ])

          Path('/tmp/sg21-impl-north-prompt.txt').write_text(prompt)
          client=Client('CohereLabs/North-Mini-Code-1.0',verbose=False)
          final=''
          for attempt in range(1,4):
              raw=client.predict(prompt,'Rust','[]','{}',api_name='/chat')
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=''
              for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
                  if msg.get('role')=='assistant':
                      content=msg.get('content','')
              candidate=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
              structured=(f'REVIEW_HEAD\n{head}' in candidate and 'REVIEW_KIND\nSG-000021_IMPLEMENTATION' in candidate)
              if structured:
                  final=candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt < 3:
                  time.sleep(10)
          if not final:
              raise SystemExit('independent semantic implementation reviewer returned no structured review after 3 provider attempts')

          checks=[
              f'REVIEW_HEAD\n{head}',
              'REVIEW_KIND\nSG-000021_IMPLEMENTATION',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              print(final)
              raise SystemExit('independent semantic implementation review produced a structured non-PASS result')

          Path('/tmp/sg21-impl-north-final.md').write_text(final+'\n')
          summary={
              'base_main':os.environ['BASE_MAIN'],
              'implementation_head':head,
              'implementation_tree':os.environ['IMPL_TREE'],
              'spec_revision':os.environ['SPEC_REVISION'],
              'workpacket_digest':packet['packet_digest'],
              'workpacket_file_sha256':hashlib.sha256(Path('/tmp/sg21-workpacket.json').read_bytes()).hexdigest(),
              'diff_sha256':os.environ['DIFF_SHA256'],
              'file_list_sha256':os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256':os.environ['DIFFCIPLINE_SHA256'],
              'precommit_diffcipline_exit':int(os.environ['PRECOMMIT_EXIT']),
              'precommit_diffcipline_sha256':os.environ['PRECOMMIT_SHA256'],
              'review_prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256':hashlib.sha256((final+'\n').encode()).hexdigest(),
              'local_tests_passed':25
          }
          Path('/tmp/sg21-impl-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$IMPL_BRANCH"

          {
            echo "## SG-000021 implementation qualification"
            echo
            cat /tmp/sg21-impl-summary.json
            echo
            echo "SG-000011 prerequisite: PASS"
            echo "Exact-head local verification: PASS"
            echo "Diffcipline exact implementation head: PASS"
            echo "Alibaba implementation accounting: 2/2"
            echo "Independent semantic implementation review: PASS"
            echo "Pushed clean branch: $IMPL_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
