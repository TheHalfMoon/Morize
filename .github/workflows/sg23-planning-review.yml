name: sg23-planning-review

on:
  push:
    branches:
      - automation/sg-000023-planning-review

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Qualify SG-000023 planning head
        shell: bash
        env:
          BASE_MAIN: 6860e80f1332f3116c19725b0f0032c99e5f1176
          PLAN_HEAD: e77974cc9a519c9380b2d11337a0077e3e4c4bc0
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main plan/sg-000023-core-property-matrices --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/plan/sg-000023-core-property-matrices)" = "$PLAN_HEAD"
          git checkout --detach "$PLAN_HEAD"
          test "$(git rev-parse HEAD)" = "$PLAN_HEAD"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg23-check.json
          specgrain prove --json SG-000012 . > /tmp/p12.json
          specgrain prove --json SG-000013 . > /tmp/p13.json
          specgrain prove --json SG-000014 . > /tmp/p14.json

          python - <<'PY'
          import json, os, subprocess
          from specgrain import load_project

          check=json.load(open('/tmp/sg23-check.json'))
          assert check['valid'] is True and check['issues']==[]

          project=load_project('.')
          node=next(n for n in project.specs if n.id=='SG-000023')
          assert node.state=='GRAIN'
          assert node.parent_id=='SG-000010'
          assert tuple(sorted(node.change_surface))==tuple(sorted([
              'crates/morize-core/src/identity.rs',
              'crates/morize-core/src/bounded.rs',
              'crates/morize-core/src/bounded_collection.rs',
          ]))

          expected={
            'SG-000012':(
              'sha256:13fc136a4f74bf67a2928642d50b750cd729bb7811bfc3dd8f7369ed4a034079',
              'sha256:256a8c55a843f00798f3e8e3f0807ee38f676a7f50c9b9380b9d26167f4f7aa7',
              '026b2e5849759915975f8ae12b111d1185fda89f',
            ),
            'SG-000013':(
              'sha256:ab6bae1410aa8d48f7081aebe7047ffe8d5420b497b9f3d744639de9109cd62c',
              'sha256:adf07a2ef558c801fcacbb3b1bb7ab627bdc0480fdec65e7fc2d1a2e86dafe8d',
              '9db66a7b4225cd5d3eff9a65d910038352d29a59',
            ),
            'SG-000014':(
              'sha256:95a31438e65a266dfd513b8ed15af56f35fe1184d725672359b567008d67a977',
              'sha256:06df9fd48a398fb1b1af3e4a6c821efa9a0508d7e9e3a795c21edadf1045ef1e',
              'fac420fd87f86b97a5ee97397e0775d00795aaa3',
            ),
          }
          for sid,path in [('SG-000012','/tmp/p12.json'),('SG-000013','/tmp/p13.json'),('SG-000014','/tmp/p14.json')]:
              p=json.load(open(path))
              rec,srev,impl=expected[sid]
              assert p['verified'] is True
              assert p['latest_record_digest']==rec
              latest=p['records'][-1]['report']
              assert latest['spec_revision']==srev
              assert latest['implementation_revision']==impl
              subprocess.run(['git','merge-base','--is-ancestor',impl,os.environ['BASE_MAIN']],check=True)

          print('SPEC_CHECK=PASS')
          print('SG000023_SPEC_REVISION='+node.revision_digest)
          print('PROOF_PREREQUISITES=PASS')
          PY

          test "$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sort | tr '\n' ' ')" = ".specgrain/specs/SG-000010.json .specgrain/specs/SG-000023.json "
          ! grep -q 'SG-000022' .specgrain/specs/SG-000023.json
          echo "PLANNING_SCOPE=PASS"

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$PLAN_HEAD" > /tmp/sg23-ocr-preview.json
          python - <<'PY'
          import json, subprocess
          x=json.load(open('/tmp/sg23-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=sorted(f['path'] for f in x['reviewable_files'])
          assert paths==['.specgrain/specs/SG-000010.json','.specgrain/specs/SG-000023.json']
          with open('/tmp/sg23-ocr-rules.json','w') as out:
              subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*paths],check=True,stdout=out)
          groups=json.load(open('/tmp/sg23-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==paths
          print('ALIBABA_ACCOUNTING=2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from gradio_client import Client
          from specgrain import load_project

          node=next(n for n in load_project('.').specs if n.id=='SG-000023')
          spec=Path('.specgrain/specs/SG-000023.json').read_text()
          roadmap=Path('docs/roadmap/FOUNDATION_CORE.md').read_text()
          excerpt=roadmap[roadmap.index('## P1 — Rust deterministic kernel'):roadmap.index('## P2')]

          prompt='\n'.join([
              'Independent semantic PLANNING review of Morize SG-000023. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={os.environ["PLAN_HEAD"]}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={node.revision_digest}',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              'Exact planning diff: SG-000010 child registration plus new SG-000023 only.',
              '',
              'Review goals:',
              '1. Grain is test-only and bounded to existing #[cfg(test)] modules in identity.rs, bounded.rs, bounded_collection.rs.',
              '2. Production source must remain byte-for-byte unchanged before existing test modules.',
              '3. Deterministic finite property matrices are not described as a true fuzz campaign.',
              '4. No randomness, fuzz engine, dependency, runtime behavior, serialization, persistence, timestamp, digest, policy, or domain semantics are authorized.',
              '5. SG-000012/13/14 proof-prerequisite identities are exact.',
              '6. Scope and acceptance criteria are sufficient to prove ID, BoundedUtf8, and BoundedVec invariants.',
              '7. The historical unmerged SG-000022 property-matrix branch is not referenced by the canonical new Grain.',
              '8. No broad parent program is promoted.',
              '',
              'SG-000023:',
              spec,
              '',
              'P1 roadmap excerpt:',
              excerpt,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              os.environ['PLAN_HEAD'],
              'REVIEW_KIND',
              'SG-000023_PLANNING',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.'
          ])

          client=Client('CohereLabs/North-Mini-Code-1.0',verbose=False)
          final=''
          for attempt in range(1,4):
              raw=client.predict(prompt,'Rust','[]','{}',api_name='/chat')
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=''
              for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
                  if msg.get('role')=='assistant':
                      content=msg.get('content','')
              candidate=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
              structured=(f'REVIEW_HEAD\n{os.environ["PLAN_HEAD"]}' in candidate and 'REVIEW_KIND\nSG-000023_PLANNING' in candidate)
              if structured:
                  final=candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt<3:
                  time.sleep(10)
          if not final:
              raise SystemExit('independent planning reviewer returned no structured review')

          print('INDEPENDENT_REVIEW_BEGIN')
          print(final)
          print('INDEPENDENT_REVIEW_END')
          checks=[
              f'REVIEW_HEAD\n{os.environ["PLAN_HEAD"]}',
              'REVIEW_KIND\nSG-000023_PLANNING',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              raise SystemExit('independent planning review produced a non-PASS result')
          print('REVIEW_PROMPT_SHA256='+hashlib.sha256(prompt.encode()).hexdigest())
          print('REVIEW_FINAL_SHA256='+hashlib.sha256((final+'\n').encode()).hexdigest())
          PY
