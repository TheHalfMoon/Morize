name: sg23-canonical-prove

on:
  push:
    branches:
      - automation/sg-000023-canonical-prove

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prove canonical SG-000023 and inspect next frontier
        shell: bash
        env:
          CANONICAL_MAIN: 64f51cf43808313679f4eb4a04d5a00fa011ac29
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          EXPECTED_RECORD: sha256:14dc204de67286a282a2b4e1d8d65fc8d9837b140ced660aa230745ddb82f68c
          EXPECTED_SPEC_REVISION: sha256:9e5cba94eec7f7488cdb02605db5cd7f4d1b41200282ca4efc0c68f058d0a779
          EXPECTED_IMPL_REVISION: 4620805a440fe1ef5d29c9015b781014a5c109d2
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$CANONICAL_MAIN"
          git checkout --detach "$CANONICAL_MAIN"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/check.json
          specgrain prove --json SG-000023 . > /tmp/prove.json
          specgrain next --json . > /tmp/next.json

          python - <<'PY'
          import json, os
          check=json.load(open('/tmp/check.json'))
          prove=json.load(open('/tmp/prove.json'))
          nxt=json.load(open('/tmp/next.json'))

          assert check['valid'] is True and check['issues']==[]
          assert prove['verified'] is True
          assert prove['latest_record_digest']==os.environ['EXPECTED_RECORD']
          assert prove['record_count']==1
          latest=prove['records'][-1]['report']
          assert latest['spec_revision']==os.environ['EXPECTED_SPEC_REVISION']
          assert latest['implementation_revision']==os.environ['EXPECTED_IMPL_REVISION']
          assert latest['issues']==[]
          assert latest['verified'] is True

          print('CANONICAL_MAIN='+os.environ['CANONICAL_MAIN'])
          print('SPEC_CHECK_VALID=true')
          print('SG000023_VERIFIED=true')
          print('SG000023_RECORD_COUNT=1')
          print('SG000023_RECORD_DIGEST='+prove['latest_record_digest'])
          print('SG000023_SPEC_REVISION='+latest['spec_revision'])
          print('SG000023_IMPLEMENTATION_REVISION='+latest['implementation_revision'])
          print('NEXT_JSON='+json.dumps(nxt,sort_keys=True,separators=(',',':')))
          PY
