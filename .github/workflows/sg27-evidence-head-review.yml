name: SG-000027 evidence-head qualification

on:
  push:
    branches:
      - automation/sg-000027-evidence-head-review

permissions:
  contents: read

jobs:
  qualify-evidence-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_MAIN: 0c21cf314be701db56724b4df2de806a027ee58f
      REVIEW_HEAD: beea4f18437f68018654a439dd5e28bc4f6bf06a
      REVIEW_PARENT: 309a807aa1567cd6f673672c6f8b08d88963fea1
      REVIEW_TREE: 83dd7ed430b015174f34ba76fd7fe5261444a0d4
      EVIDENCE_PATH: .specgrain/evidence/SG-000027/762bdd56ba976c5158a5d5be31f510f51caad5410133b33ec7b50f420cd3200b.json
      EVIDENCE_FILE_SHA256: c4b17a3f4dda11deaa78f52555d5b7e2372b518194f88503ae0208be869bf638
      RECORD_DIGEST: sha256:762bdd56ba976c5158a5d5be31f510f51caad5410133b33ec7b50f420cd3200b
      SPEC_REVISION: sha256:7256886d9dfaf74c77e21531e51c72bf5e7b8889f40866b5851096eb9a9918ad
      IMPLEMENTATION_REVISION: 0c21cf314be701db56724b4df2de806a027ee58f
      DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
      OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: beea4f18437f68018654a439dd5e28bc4f6bf06a
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Prove exact evidence-head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          test "$(git rev-parse HEAD^)" = "$REVIEW_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$REVIEW_TREE"
          test "$(git rev-parse "$REVIEW_PARENT^{tree}")" = "$REVIEW_TREE"
          test -z "$(git diff --name-only "$REVIEW_PARENT...$REVIEW_HEAD")"
          test "$(git diff --name-only "$BASE_MAIN...$REVIEW_HEAD")" = "$EVIDENCE_PATH"
          test "$(sha256sum "$EVIDENCE_PATH" | awk '{print $1}')" = "$EVIDENCE_FILE_SHA256"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ["EVIDENCE_PATH"], encoding="utf-8"))
          assert data["record_digest"] == os.environ["RECORD_DIGEST"], data
          report=data["report"]
          assert report["verified"] is True, report
          assert report["spec_id"] == "SG-000027", report
          assert report["spec_revision"] == os.environ["SPEC_REVISION"], report
          assert report["implementation_revision"] == os.environ["IMPLEMENTATION_REVISION"], report
          assert report["issues"] == [], report
          assert len(report["acceptance_checks"]) == 15 and all(x["passed"] for x in report["acceptance_checks"]), report
          assert len(report["evidence_checks"]) == 13 and all(x["passed"] for x in report["evidence_checks"]), report
          print("EVIDENCE_HEAD_IDENTITY=PASS")
          print("EVIDENCE_TREE_IDENTITY=PASS")
          print("EVIDENCE_RECORD=PASS")
          PY

      - name: Prove native SpecGrain state
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            "git+https://github.com/TheHalfMoon/SpecGrain.git@5de7d6499bb0a9e3a191fc0934399cf099d1980a"
          specgrain prove SG-000027 . --json | tee /tmp/sg27-head-proof.json
          python3 - <<'PY'
          import json, os
          proof=json.load(open("/tmp/sg27-head-proof.json"))
          assert proof["verified"] is True, proof
          assert proof["latest_record_digest"] == os.environ["RECORD_DIGEST"], proof
          report=proof["records"][-1]["report"]
          assert report["implementation_revision"] == os.environ["IMPLEMENTATION_REVISION"], report
          assert report["issues"] == [], report
          print("NATIVE_SPEC_GRAIN_PROVE=PASS")
          PY

      - name: Qualify evidence diff with Diffcipline and Alibaba accounting
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/TheHalfMoon/Diffcipline.git /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked \
            --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml -- \
            check --base "$BASE_MAIN" --risk R3 --run --json \
            > /tmp/sg27-head-diffcipline.json 2>/tmp/sg27-head-diffcipline.err
          python3 - <<'PY'
          import json
          lines=[x for x in open("/tmp/sg27-head-diffcipline.json") if x.strip()]
          result=json.loads(lines[-1])
          assert result["verdict"] == "PASS", result
          assert result["changed_files"] == 1, result
          assert result["scope_violations"] == [], result
          assert all(x["state"] == "PASS" for x in result["verification"]), result
          print("DIFFCIPLINE_EVIDENCE_HEAD_R3=PASS")
          PY

          git clone --quiet https://github.com/alibaba/open-code-review.git /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview \
            --format json --from "$BASE_MAIN" --to "$REVIEW_HEAD" \
            > /tmp/sg27-head-ocr.json
          python3 - <<'PY'
          import json, os, subprocess
          p=json.load(open("/tmp/sg27-head-ocr.json"))
          assert p["total_files"] == 1, p
          reviewable=[x["path"] for x in p.get("reviewable_files",[])]
          excluded=[x["path"] for x in p.get("excluded_files",[])]
          assert sorted(reviewable+excluded) == [os.environ["EVIDENCE_PATH"]], p
          accounted=[]
          if reviewable:
              with open("/tmp/sg27-head-rules.json","w") as out:
                  subprocess.run(["/tmp/ocr-bin","delegate","rule","--format","json",*reviewable],check=True,stdout=out)
              groups=json.load(open("/tmp/sg27-head-rules.json"))["groups"]
              accounted=sorted(path for group in groups for path in group["files"])
              assert accounted == sorted(reviewable), accounted
          print(f"ALIBABA_EVIDENCE_HEAD_ACCOUNTING=total=1;reviewable={len(reviewable)};excluded={len(excluded)};rule_accounted={len(accounted)}")
          PY

      - name: Independent semantic evidence-head review
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          python3 - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from gradio_client import Client

          record=Path(os.environ["EVIDENCE_PATH"]).read_text()
          prompt="\n".join([
            "Independent semantic EVIDENCE-HEAD review of Morize SG-000027. Return final structured review only; do not expose chain-of-thought or tool traces.",
            "",
            f"REVIEW_HEAD={os.environ['REVIEW_HEAD']}",
            f"REVIEW_PARENT={os.environ['REVIEW_PARENT']}",
            f"REVIEW_TREE={os.environ['REVIEW_TREE']}",
            f"BASE_MAIN={os.environ['BASE_MAIN']}",
            f"RECORD_DIGEST={os.environ['RECORD_DIGEST']}",
            f"EVIDENCE_FILE_SHA256={os.environ['EVIDENCE_FILE_SHA256']}",
            "The review head is an empty forward-only synchronization commit whose tree is byte-identical to the previously independently reviewed evidence parent.",
            "Native SpecGrain proof, Diffcipline R3, and Alibaba one-file accounting all pass on this exact head.",
            "",
            "Review goals:",
            "1. Confirm the exact head contains exactly one evidence JSON change relative to base main and no content change relative to its evidence parent.",
            "2. Confirm the evidence record is verified SG-000027 with 15/15 acceptance, 13/13 evidence, and no issues.",
            "3. Confirm it binds the implementation and prerequisite evidence without inventing text/wire/numeric/authority semantics.",
            "4. Treat the empty synchronization commit as event/CI transport only, not new product or evidence semantics.",
            "",
            "Evidence record:",
            record,
            "",
            "Return exactly:",
            "REVIEW_HEAD",
            os.environ["REVIEW_HEAD"],
            "REVIEW_KIND",
            "SG-000027_EVIDENCE_HEAD",
            "CRITICAL = NONE",
            "HIGH = NONE",
            "MEDIUM = NONE",
            "LOW = NONE",
            "FINDINGS",
            "- NONE",
            "FINAL_GATE = PASS",
            "Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.",
          ])
          client=Client("CohereLabs/North-Mini-Code-1.0", verbose=False)
          final=""
          for attempt in range(1,4):
              raw=client.predict(prompt,"Rust","[]","{}",api_name="/chat")
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=""
              if isinstance(obj,dict):
                  for m in obj.get("history",[]):
                      if m.get("role")=="assistant":
                          content=m.get("content","")
              candidate=content.split("</think>",1)[-1].strip() if "</think>" in content else content.strip()
              if f"REVIEW_HEAD\n{os.environ['REVIEW_HEAD']}" in candidate and "REVIEW_KIND\nSG-000027_EVIDENCE_HEAD" in candidate:
                  final=candidate
                  break
              print(f"REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED")
              if attempt<3: time.sleep(10)
          if not final:
              raise SystemExit("no structured review")
          required=[
              f"REVIEW_HEAD\n{os.environ['REVIEW_HEAD']}",
              "REVIEW_KIND\nSG-000027_EVIDENCE_HEAD",
              "CRITICAL = NONE","HIGH = NONE","MEDIUM = NONE","LOW = NONE",
              "FINDINGS\n- NONE","FINAL_GATE = PASS",
          ]
          if not all(x in final for x in required):
              print(final)
              raise SystemExit("semantic evidence-head review did not pass")
          Path("/tmp/sg27-head-review.txt").write_text(final+"\n")
          Path("/tmp/sg27-head-review-summary.json").write_text(json.dumps({
              "review_head":os.environ["REVIEW_HEAD"],
              "review_parent":os.environ["REVIEW_PARENT"],
              "review_tree":os.environ["REVIEW_TREE"],
              "review_prompt_sha256":hashlib.sha256(prompt.encode()).hexdigest(),
              "review_final_sha256":hashlib.sha256((final+"\n").encode()).hexdigest(),
              "final_gate":"PASS",
          },sort_keys=True,indent=2)+"\n")
          print("INDEPENDENT_EVIDENCE_HEAD_REVIEW_BEGIN")
          print(final)
          print("INDEPENDENT_EVIDENCE_HEAD_REVIEW_END")
          print(Path("/tmp/sg27-head-review-summary.json").read_text())
          PY

      - name: Upload exact-head qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sg-000027-evidence-head-qualification
          path: |
            /tmp/sg27-head-proof.json
            /tmp/sg27-head-diffcipline.json
            /tmp/sg27-head-diffcipline.err
            /tmp/sg27-head-ocr.json
            /tmp/sg27-head-rules.json
            /tmp/sg27-head-review.txt
            /tmp/sg27-head-review-summary.json
          if-no-files-found: error
          retention-days: 30
