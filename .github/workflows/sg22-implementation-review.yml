name: sg22-implementation-review

on:
  push:
    branches:
      - automation/sg-000022-implementation-review

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Qualify exact SG-000022 implementation head
        shell: bash
        env:
          BASE_MAIN: 2ef2a6c1ca13e7d2e6daf337884f84b4c2bc60d9
          IMPL_HEAD: 19f0e651845e7a73c27cd5c815fe808c8ec60a86
          SPEC_REVISION: sha256:caf22aceeb05340b62832819a6aea59b6ed80c67cdbb80f5c77a20c5fea43afd
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main impl/sg-000022-timestamp-primitive --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/impl/sg-000022-timestamp-primitive)" = "$IMPL_HEAD"
          git checkout --detach "$IMPL_HEAD"
          test "$(git rev-parse HEAD)" = "$IMPL_HEAD"
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg22-base-check.json
          specgrain prove --json SG-000011 . > /tmp/sg22-sg11-proof.json
          python - <<'PY'
          import json, os, subprocess
          check=json.load(open('/tmp/sg22-base-check.json'))
          proof=json.load(open('/tmp/sg22-sg11-proof.json'))
          assert check['valid'] is True and check['issues']==[]
          assert proof['verified'] is True
          assert proof['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          latest=proof['records'][-1]['report']
          assert latest['spec_revision']=='sha256:0c609888d253ab94487f9e1bdd2e5370f991321d57269f0b237d778ac30f129d'
          assert latest['implementation_revision']=='b54879d7c04ba914997f14034c3c1b262b9629f6'
          subprocess.run([
              'git','merge-base','--is-ancestor',
              latest['implementation_revision'],
              os.environ['BASE_MAIN']
          ],check=True)
          print('SG-000011 prerequisite: PASS')
          PY

          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          base='2ef2a6c1ca13e7d2e6daf337884f84b4c2bc60d9'

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'{base}:{path}'],text=True).strip()

          def section(path,start,end=None):
              text=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
              a=text.index(start)
              b=text.index(end,a) if end else len(text)
              return text[a:b]

          def full(path):
              return subprocess.check_output(['git','show',f'{base}:{path}'],text=True)

          evidence_path='.specgrain/evidence/SG-000011/1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9.json'
          selections=[
              ('sg22-grain','.specgrain/specs/SG-000022.json',
               full('.specgrain/specs/SG-000022.json'),
               'Exact SG-000022 GRAIN contract, acceptance criteria, proof prerequisite, change surface, and evidence requirements.',100),
              ('data-model-temporal','docs/DATA_MODEL.md',
               section('docs/DATA_MODEL.md','## 22. Temporal invariants','## 23.'),
               'Canonical temporal invariants distinguishing domain-valid time from Morize knowledge/commit time.',95),
              ('sync-time','docs/SYNC_MODEL.md',
               section('docs/SYNC_MODEL.md','## 8. Time','## 9.'),
               'Canonical warning that wall-clock timestamps do not establish distributed causality and clock skew must not silently decide conflicts.',90),
              ('proof-prerequisites','docs/adr/0004-verified-proof-prerequisites.md',
               full('docs/adr/0004-verified-proof-prerequisites.md'),
               'Canonical ADR-0004 proof-prerequisite policy used by SG-000022.',85),
              ('sg11-evidence',evidence_path,
               full(evidence_path),
               'Exact canonical native verification evidence for the SG-000011 proof prerequisite.',80),
              ('core-export-surface','crates/morize-core/src/lib.rs',
               full('crates/morize-core/src/lib.rs'),
               'Exact baseline morize-core export surface that SG-000022 may extend.',70),
          ]

          records=[]
          for source_id,path,data,reason,priority in selections:
              encoded=data.encode()
              records.append({
                  'source_id':source_id,
                  'provenance':f'git:{base}:{path}',
                  'selection_reason':reason,
                  'revision':f'git:{blob(path)}',
                  'size_bytes':len(encoded),
                  'token_cost':(len(encoded)+3)//4,
                  'requirement':'required',
                  'priority':priority,
              })
          total=sum(r['token_cost'] for r in records)
          assert total <= 12000, total
          Path('/tmp/sg22-context-sources.json').write_text(
              json.dumps(records,indent=2,sort_keys=True,ensure_ascii=False)+'\n'
          )
          print('CONTEXT_SOURCE_COUNT='+str(len(records)))
          print('CONTEXT_TOKEN_TOTAL='+str(total))
          PY

          specgrain packet SG-000022 .             --context-sources /tmp/sg22-context-sources.json             --json > /tmp/sg22-workpacket.json

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          x=json.load(open('/tmp/sg22-workpacket.json'))
          assert x['spec_id']=='SG-000022'
          assert x['spec_revision']==os.environ['SPEC_REVISION']
          assert len(x['context_sources'])==6
          print('WORKPACKET_DIGEST='+x['packet_digest'])
          print('WORKPACKET_FILE_SHA256='+hashlib.sha256(Path('/tmp/sg22-workpacket.json').read_bytes()).hexdigest())
          PY

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline
          cargo clippy --workspace --all-targets --offline -- -D warnings
          cargo test --workspace --all-targets --offline 2>&1 | tee /tmp/sg22-tests.txt

          python - <<'PY'
          import re
          text=open('/tmp/sg22-tests.txt').read()
          counts=[int(x) for x in re.findall(r'test result: ok\. (\d+) passed;',text)]
          assert counts
          total=sum(counts)
          assert total==29, (counts,total)
          print('EXACT_HEAD_TESTS_PASSED=29')
          PY

          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sort | tr '\n' ' ')" = "crates/morize-core/src/lib.rs crates/morize-core/src/timestamp.rs "
          test "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | wc -l)" -eq 2
          git diff --check "$BASE_MAIN...$IMPL_HEAD"
          test -z "$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" -- Cargo.toml Cargo.lock '*/Cargo.toml')"

          DIFF_SHA256="$(git diff "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$IMPL_HEAD" | sha256sum | awk '{print $1}')"

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg22-diffcipline.json 2>/tmp/sg22-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg22-diffcipline.json | awk '{print $1}')"
          python - <<'PY'
          import json
          lines=[line for line in open('/tmp/sg22-diffcipline.json') if line.strip()]
          x=json.loads(lines[-1])
          assert x['verdict']=='PASS'
          assert x['changed_files']==2
          assert x['scope_violations']==[]
          assert all(v['state']=='PASS' for v in x['verification'])
          print('Diffcipline exact implementation head: PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$IMPL_HEAD"             > /tmp/sg22-ocr-preview.json
          python - <<'PY'
          import json, subprocess
          x=json.load(open('/tmp/sg22-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=sorted(f['path'] for f in x['reviewable_files'])
          assert paths==['crates/morize-core/src/lib.rs','crates/morize-core/src/timestamp.rs']
          with open('/tmp/sg22-ocr-rules.json','w') as out:
              subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*paths],check=True,stdout=out)
          groups=json.load(open('/tmp/sg22-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==paths
          print('Alibaba implementation accounting: 2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          export DIFF_SHA256 FILE_LIST_SHA256 DIFFCIPLINE_SHA256
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from gradio_client import Client

          packet=json.loads(Path('/tmp/sg22-workpacket.json').read_text())
          timestamp=Path('crates/morize-core/src/timestamp.rs').read_text()
          lib=Path('crates/morize-core/src/lib.rs').read_text()
          head=os.environ['IMPL_HEAD']

          prompt='\n'.join([
              'Independent semantic IMPLEMENTATION review of Morize SG-000022. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={head}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={os.environ["SPEC_REVISION"]}',
              f'WORKPACKET_DIGEST={packet["packet_digest"]}',
              f'DIFF_SHA256={os.environ["DIFF_SHA256"]}',
              f'FILE_LIST_SHA256={os.environ["FILE_LIST_SHA256"]}',
              f'DIFFCIPLINE_SHA256={os.environ["DIFFCIPLINE_SHA256"]}',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              'Exact changed paths: crates/morize-core/src/lib.rs and crates/morize-core/src/timestamp.rs.',
              'Exact-head verification in this run: fmt PASS; check offline PASS; clippy offline -D warnings PASS; tests 29/29 PASS.',
              'Cargo manifests and Cargo.lock unchanged.',
              '',
              'Contract review goals:',
              '1. Timestamp representation is signed Unix mathematical floor-seconds plus subsecond nanoseconds 0..=999_999_999.',
              '2. (-1, 999_999_999) is exactly one nanosecond before UNIX_EPOCH and ordering is correct before/at/after epoch.',
              '3. from_unix_parts rejects nanoseconds >= 1_000_000_000 and does not normalize, truncate, wrap, or silently alter input.',
              '4. public surface is limited to Timestamp, TimestampError, UNIX_EPOCH, checked constructor, and two accessors plus required value traits.',
              '5. no current-time/monotonic clock acquisition, SystemTime/Instant conversion, duration arithmetic, timezone/calendar/leap-second behavior, Display/FromStr/parser, serialization, persistence, migration, storage, API/MCP/retrieval, transport, or dependency behavior.',
              '6. TimestampError is bounded metadata-only and no sensitive/source/platform payload is introduced.',
              '7. scope is exactly timestamp.rs + lib.rs and preserves existing exports.',
              '8. tests cover valid/rejected nanosecond bounds, canonical negative-time semantics, epoch boundaries, ordering, equality/hash, and Copy behavior.',
              '9. SG-000011 proof prerequisite remains exact and packet context includes both ADR-0004 and the evidence record.',
              '',
              'WorkPacket:',
              json.dumps(packet,sort_keys=True),
              '',
              'timestamp.rs:',
              timestamp,
              '',
              'lib.rs:',
              lib,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              head,
              'REVIEW_KIND',
              'SG-000022_IMPLEMENTATION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.'
          ])

          Path('/tmp/sg22-review-prompt.txt').write_text(prompt)
          client=Client('CohereLabs/North-Mini-Code-1.0',verbose=False)
          final=''
          for attempt in range(1,4):
              raw=client.predict(prompt,'Rust','[]','{}',api_name='/chat')
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=''
              for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
                  if msg.get('role')=='assistant':
                      content=msg.get('content','')
              candidate=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
              structured=(f'REVIEW_HEAD\n{head}' in candidate and 'REVIEW_KIND\nSG-000022_IMPLEMENTATION' in candidate)
              if structured:
                  final=candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt < 3:
                  time.sleep(10)
          if not final:
              raise SystemExit('independent semantic implementation reviewer returned no structured review after 3 provider attempts')

          Path('/tmp/sg22-review-final.md').write_text(final+'\n')
          print('INDEPENDENT_REVIEW_BEGIN')
          print(final)
          print('INDEPENDENT_REVIEW_END')

          checks=[
              f'REVIEW_HEAD\n{head}',
              'REVIEW_KIND\nSG-000022_IMPLEMENTATION',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              raise SystemExit('independent semantic implementation review produced a structured non-PASS result')

          summary={
              'base_main':os.environ['BASE_MAIN'],
              'implementation_head':head,
              'spec_revision':os.environ['SPEC_REVISION'],
              'workpacket_digest':packet['packet_digest'],
              'workpacket_file_sha256':hashlib.sha256(Path('/tmp/sg22-workpacket.json').read_bytes()).hexdigest(),
              'diff_sha256':os.environ['DIFF_SHA256'],
              'file_list_sha256':os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256':os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256':hashlib.sha256((final+'\n').encode()).hexdigest(),
              'tests_passed':29
          }
          Path('/tmp/sg22-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('QUALIFICATION_SUMMARY_BEGIN')
          print(json.dumps(summary,indent=2,sort_keys=True))
          print('QUALIFICATION_SUMMARY_END')
          PY

          test -z "$(git status --porcelain)"

          {
            echo "## SG-000022 implementation qualification"
            echo
            cat /tmp/sg22-summary.json
            echo
            echo "SG-000011 prerequisite: PASS"
            echo "Exact-head cargo verification: PASS"
            echo "Diffcipline exact implementation head: PASS"
            echo "Alibaba implementation accounting: 2/2"
            echo "Independent semantic implementation review: PASS"
            echo "Implementation branch was not mutated by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
