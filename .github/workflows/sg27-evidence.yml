name: SG-000027 native evidence generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  generate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANONICAL_MAIN: 0c21cf314be701db56724b4df2de806a027ee58f
      PACKET_BASE: c76496d9b701088d1bd9292df63d16925ce34fce
      IMPL_HEAD: b20503493b693a96a0a97c120d5605a304874630
      SPEC_REVISION: sha256:7256886d9dfaf74c77e21531e51c72bf5e7b8889f40866b5851096eb9a9918ad
      PACKET_DIGEST: sha256:33323089ff7a003f3fe9a4e144f3636b70f25b26ab233fef818a69026c0826ec
      PACKET_FILE_SHA256: 610843f07e14848215fff88282d0a9ec5a584503c996bf2c5a1b4974380fa3c8
      PACKET_RUN: "35563621204"
      PACKET_ARTIFACT_DIGEST: sha256:ab0cd3a38cda3f040009272188e3216effc37802cbaa2afe68538a62560578d0
      IMPL_DIFF_SHA256: c6c4c7e45765e5e5e2ea292c344749a2588ffd192fd4cee64b2f2d4483537068
      IMPL_FILE_LIST_SHA256: 9b071591440018ea7472d76cb1041212ffc252ea3bc093b35a4c175a0f064b96
      IMPL_REVIEW_SHA256: eba00a8ac01a8cf093a84791424f1f197b4e5d3a5fca124d39ae0a678e23f38b
      PR_CI_RUN: "35563702723"
      QUALIFICATION_RUN: "35563762612"
      MAIN_CI_RUN: "35563952479"
      POSTMERGE_RUN: "35564229089"
      DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
      OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
      EVIDENCE_BRANCH: evidence/sg-000027-verification
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Install pinned SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            "git+https://github.com/TheHalfMoon/SpecGrain.git@5de7d6499bb0a9e3a191fc0934399cf099d1980a"

      - name: Generate and independently qualify native evidence
        shell: bash
        run: python .github/automation/sg27_evidence.py

      - name: Upload evidence-generation audit bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sg-000027-native-evidence-generation
          path: |
            /tmp/sg27-context-sources.json
            /tmp/sg27-workpacket.json
            /tmp/sg27-evidence-diffcipline.json
            /tmp/sg27-evidence-diffcipline.err
            /tmp/sg27-evidence-ocr.json
            /tmp/sg27-evidence-rules.json
            /tmp/sg27-evidence-review-prompt.txt
            /tmp/sg27-evidence-review-final.txt
            /tmp/sg27-evidence-summary.json
            .specgrain/evidence/SG-000027/*.json
          if-no-files-found: error
          retention-days: 30

# Forward-only synchronization marker after PR registration.
