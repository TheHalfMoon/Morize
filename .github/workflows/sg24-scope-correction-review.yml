name: sg24-scope-correction-review

on:
  push:
    branches:
      - automation/sg-000024-scope-correction-review

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Qualify exact SG-000024 scope correction
        shell: bash
        env:
          BASE_MAIN: e313503bc2b76fa8c6584ae27dad7aee0b831a25
          PLAN_HEAD: deeeaac7e7fab09a745249624aab7b571bba15ca
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main plan/sg-000024-diffcipline-fuzz-scope --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/plan/sg-000024-diffcipline-fuzz-scope)" = "$PLAN_HEAD"
          git checkout --detach "$PLAN_HEAD"
          test "$(git rev-parse HEAD)" = "$PLAN_HEAD"
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg24-correction-check.json
          specgrain prove --json SG-000012 . > /tmp/p12.json
          specgrain prove --json SG-000013 . > /tmp/p13.json
          specgrain prove --json SG-000014 . > /tmp/p14.json
          specgrain prove --json SG-000023 . > /tmp/p23.json

          python - <<'PY'
          import json, os, subprocess, tomllib
          from specgrain import load_project

          check=json.load(open('/tmp/sg24-correction-check.json'))
          assert check['valid'] is True and check['issues']==[]

          base_policy=tomllib.loads(subprocess.check_output(
              ['git','show',os.environ['BASE_MAIN']+':.diffcipline.toml'],text=True))
          head_policy=tomllib.loads(open('.diffcipline.toml').read())

          before=base_policy['policy']['expected_files']
          after=head_policy['policy']['expected_files']
          assert 'fuzz/**' not in before
          assert after.count('fuzz/**') == 1
          assert [x for x in after if x != 'fuzz/**'] == before

          base_policy_without=dict(base_policy['policy'])
          head_policy_without=dict(head_policy['policy'])
          base_policy_without.pop('expected_files')
          head_policy_without.pop('expected_files')
          assert head_policy_without == base_policy_without
          assert head_policy['verification'] == base_policy['verification']

          base_spec=json.loads(subprocess.check_output(
              ['git','show',os.environ['BASE_MAIN']+':.specgrain/specs/SG-000024.json'],text=True))
          head_spec=json.load(open('.specgrain/specs/SG-000024.json'))
          assert head_spec['change_surface'] == base_spec['change_surface']
          assert len(head_spec['change_surface']) == 10
          assert head_spec['metadata']['morize']['proof_prerequisites'] == base_spec['metadata']['morize']['proof_prerequisites']
          assert head_spec['metadata']['readiness']['toolchain'] == base_spec['metadata']['readiness']['toolchain']
          assert 'E-DIFFCIPLINE-FUZZ-SCOPE-ADMISSION' in head_spec['evidence']['required']
          admission=head_spec['metadata']['readiness']['diffcipline_scope_admission']
          assert admission['required_before_packet'] is True
          assert admission['allowed_delta'] == 'Add fuzz/** to policy.expected_files only.'

          node=next(n for n in load_project('.').specs if n.id=='SG-000024')
          assert node.state=='GRAIN'
          print('SPEC_CHECK=PASS')
          print('POLICY_DELTA=ADD_FUZZ_EXPECTED_FILES_ONLY')
          print('IMPLEMENTATION_CHANGE_SURFACE=10_UNCHANGED')
          print('SG000024_SPEC_REVISION='+node.revision_digest)

          expected={
            'SG-000012':('/tmp/p12.json','sha256:13fc136a4f74bf67a2928642d50b750cd729bb7811bfc3dd8f7369ed4a034079','sha256:256a8c55a843f00798f3e8e3f0807ee38f676a7f50c9b9380b9d26167f4f7aa7','026b2e5849759915975f8ae12b111d1185fda89f'),
            'SG-000013':('/tmp/p13.json','sha256:ab6bae1410aa8d48f7081aebe7047ffe8d5420b497b9f3d744639de9109cd62c','sha256:adf07a2ef558c801fcacbb3b1bb7ab627bdc0480fdec65e7fc2d1a2e86dafe8d','9db66a7b4225cd5d3eff9a65d910038352d29a59'),
            'SG-000014':('/tmp/p14.json','sha256:95a31438e65a266dfd513b8ed15af56f35fe1184d725672359b567008d67a977','sha256:06df9fd48a398fb1b1af3e4a6c821efa9a0508d7e9e3a795c21edadf1045ef1e','fac420fd87f86b97a5ee97397e0775d00795aaa3'),
            'SG-000023':('/tmp/p23.json','sha256:14dc204de67286a282a2b4e1d8d65fc8d9837b140ced660aa230745ddb82f68c','sha256:9e5cba94eec7f7488cdb02605db5cd7f4d1b41200282ca4efc0c68f058d0a779','4620805a440fe1ef5d29c9015b781014a5c109d2'),
          }
          for sid,(path,record,srev,impl) in expected.items():
              proof=json.load(open(path))
              assert proof['verified'] is True
              assert proof['latest_record_digest']==record
              latest=proof['records'][-1]['report']
              assert latest['spec_revision']==srev
              assert latest['implementation_revision']==impl
              assert latest['issues']==[]
              subprocess.run(['git','merge-base','--is-ancestor',impl,os.environ['BASE_MAIN']],check=True)
              print(sid+'_PREREQUISITE=PASS')
          PY

          test "$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sort | tr '\n' ' ')" = ".diffcipline.toml .specgrain/specs/SG-000024.json "
          git diff --check "$BASE_MAIN...$PLAN_HEAD"
          echo "CORRECTION_SCOPE=PASS"

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked             --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml --             check --base "$BASE_MAIN" --risk R2 --run --json             > /tmp/sg24-correction-diffcipline.json 2>/tmp/sg24-correction-diffcipline.err
          python - <<'PY'
          import json
          lines=[line for line in open('/tmp/sg24-correction-diffcipline.json') if line.strip()]
          proof=json.loads(lines[-1])
          assert proof['verdict']=='PASS', proof
          assert proof['changed_files']==2
          assert proof['scope_violations']==[]
          assert all(v['state']=='PASS' for v in proof['verification'])
          print('DIFFCIPLINE_R2=PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$PLAN_HEAD" > /tmp/sg24-correction-ocr.json
          python - <<'PY'
          import json, subprocess
          x=json.load(open('/tmp/sg24-correction-ocr.json'))
          assert x['total_files']==2
          reviewable=sorted(f['path'] for f in x.get('reviewable_files',[]))
          excluded=sorted(f['path'] for f in x.get('excluded_files',[]))
          assert sorted(reviewable+excluded)==['.diffcipline.toml','.specgrain/specs/SG-000024.json']
          rule_accounted=[]
          if reviewable:
              with open('/tmp/sg24-correction-rules.json','w') as out:
                  subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*reviewable],check=True,stdout=out)
              groups=json.load(open('/tmp/sg24-correction-rules.json'))['groups']
              rule_accounted=sorted(p for g in groups for p in g['files'])
              assert rule_accounted==reviewable
          summary={'total':2,'reviewable':reviewable,'excluded':excluded,'rule_accounted':rule_accounted}
          open('/tmp/sg24-correction-ocr-summary.json','w').write(json.dumps(summary,sort_keys=True))
          print('ALIBABA_ACCOUNTING='+json.dumps(summary,sort_keys=True))
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          python - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          from gradio_client import Client
          from specgrain import load_project

          node=next(n for n in load_project('.').specs if n.id=='SG-000024')
          diff=subprocess.check_output(['git','diff','--unified=40',os.environ['BASE_MAIN']+'...'+os.environ['PLAN_HEAD']],text=True)
          ocr=Path('/tmp/sg24-correction-ocr-summary.json').read_text()
          prompt='\n'.join([
              'Independent semantic PLANNING-CORRECTION review of Morize SG-000024. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={os.environ["PLAN_HEAD"]}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={node.revision_digest}',
              'Automated checks proved: SpecGrain valid; SG-000024 remains GRAIN; implementation change_surface remains exactly 10 files; SG12/13/14/23 proof identities remain exact; only Diffcipline expected_files gains fuzz/**; every other policy and verification field is unchanged; Diffcipline R2 PASS with zero scope violations.',
              'Alibaba accounting: '+ocr,
              '',
              'Review goals:',
              '1. The correction is necessary because pinned Diffcipline treats paths outside non-empty expected_files as scope violations while SG-000024 authorizes fuzz/**.',
              '2. Policy change is exactly one admission: fuzz/** in expected_files.',
              '3. Forbidden surfaces, manifest/lock policies, untracked-file policy, and all verification commands are unchanged.',
              '4. SG-000024 implementation surface remains the original ten fuzz/workflow files and does not absorb .diffcipline.toml into the implementation diff.',
              '5. The admission is explicitly required before WorkPacket export and has dedicated required evidence.',
              '6. Toolchain identity, proof prerequisites, risk, isolation, and fuzz non-claims are not weakened.',
              '7. No implementation or runtime behavior is introduced by this planning correction.',
              '',
              'Exact correction diff:',
              diff,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              os.environ['PLAN_HEAD'],
              'REVIEW_KIND',
              'SG-000024_SCOPE_CORRECTION',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.'
          ])
          client=Client('CohereLabs/North-Mini-Code-1.0',verbose=False)
          final=''
          for attempt in range(1,4):
              raw=client.predict(prompt,'Rust','[]','{}',api_name='/chat')
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=''
              for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
                  if msg.get('role')=='assistant':
                      content=msg.get('content','')
              candidate=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
              structured=(f'REVIEW_HEAD\n{os.environ["PLAN_HEAD"]}' in candidate and 'REVIEW_KIND\nSG-000024_SCOPE_CORRECTION' in candidate)
              if structured:
                  final=candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt<3:
                  time.sleep(10)
          if not final:
              raise SystemExit('independent scope-correction reviewer returned no structured review')
          print('INDEPENDENT_REVIEW_BEGIN')
          print(final)
          print('INDEPENDENT_REVIEW_END')
          required=[
              f'REVIEW_HEAD\n{os.environ["PLAN_HEAD"]}',
              'REVIEW_KIND\nSG-000024_SCOPE_CORRECTION',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in required):
              raise SystemExit('independent scope-correction review produced a non-PASS result')
          print('REVIEW_PROMPT_SHA256='+hashlib.sha256(prompt.encode()).hexdigest())
          print('REVIEW_FINAL_SHA256='+hashlib.sha256((final+'\n').encode()).hexdigest())
          PY

          test -z "$(git status --porcelain)"
