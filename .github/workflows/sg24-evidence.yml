name: sg24-evidence

on:
  push:
    branches:
      - automation/sg-000024-evidence

permissions:
  contents: write
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Install pinned SpecGrain
        shell: bash
        env:
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
        run: |
          python -m pip install --disable-pip-version-check --quiet "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

      - name: Generate and qualify SG-000024 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL_MAIN: 8cf97145d081f256c18232f2737fbfe1db161baf
          PACKET_BASE: 687d5681d616dce0d84809992c9d36e791f77eb9
          IMPL_HEAD: b98ba14aebf450c29e48c0264476a0c6d101d4ef
          SPEC_REVISION: sha256:71afd4f7e9a9d16438fdda6181a0a6774c731e87737711f5f6d8e38e350b7e96
          PACKET_DIGEST: sha256:f30e31c88fa088c6051c2e962777eb25e7fb60beaebcf451da2f0c176cec2c5b
          PACKET_FILE_SHA256: fcb450c99b35721c7f9587776d7b2bee6cd4de3025b72ae1c6234ce8cee26a79
          IMPL_DIFF_SHA256: 2210b50aa5742fb20e52495712f32fd2e9754743a814878d49d9527d93443f67
          IMPL_FILE_LIST_SHA256: ee85e3305fa29ac2e98e0a8984015d927736ca6044815607a414db7beb22a909
          IMPL_REVIEW_SHA256: 5bbaccd99fbc1f0c76f34f901ec08d427d9814dd1579486b6b52f04e4d9b676e
          PR_CI_RUN: "35527207231"
          PR_FUZZ_RUN: "35527207234"
          QUALIFICATION_RUN: "35527289240"
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
          RUST_NIGHTLY: nightly-2026-09-18
          CARGO_FUZZ_VERSION: "0.13.2"
          CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
          FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
          EVIDENCE_BRANCH: evidence/sg-000024-verification
          FUZZ_LOCK_SHA256: 60143f398fee9ef9ac23fffd773828b11bd7710eb4817dab115f865611d69c48
          FUZZ_WORKFLOW_SHA256: bb936184ee021272d07c1a15f31591ad58a10ca12cba8f974f0287c77a2bcf79
        run: python .github/automation/sg24_evidence.py
