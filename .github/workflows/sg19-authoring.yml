name: sg19-canonical-proof

on:
  push:
    branches:
      - automation/sg-000019-authoring

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prove SG-000019 on exact canonical main
        shell: bash
        env:
          CANONICAL_MAIN: 7551ef18458470db2d5bbfbcb76adb17315a057e
          EXPECTED_RECORD: sha256:5f162f7283d2dd29ab35c8de2c79fd27af10b943fe8ba7e1c8f3e81ee2261e1f
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$CANONICAL_MAIN"
          git checkout --detach origin/main
          test -z "$(git status --porcelain)"

          python -m pip install --disable-pip-version-check --quiet \
            "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg19-canonical-check.json
          specgrain prove --json SG-000019 . > /tmp/sg19-canonical-proof.json

          python - <<'PY'
          import json,os
          from pathlib import Path
          check=json.load(open('/tmp/sg19-canonical-check.json'))
          proof=json.load(open('/tmp/sg19-canonical-proof.json'))
          spec=json.loads(Path('.specgrain/specs/SG-000019.json').read_text())
          assert check['valid'] is True and check['issues']==[]
          assert proof['verified'] is True
          assert proof['record_count']==1
          assert proof['latest_record_digest']==os.environ['EXPECTED_RECORD']
          assert spec['state']=='GRAIN'
          print('CANONICAL_MAIN='+os.environ['CANONICAL_MAIN'])
          print('SG19_VERIFIED=true')
          print('SG19_RECORD_COUNT=1')
          print('SG19_LATEST_RECORD='+proof['latest_record_digest'])
          print('SG19_SPEC_STATE=GRAIN')
          print('SPEC_GRAIN_CHECK=PASS')
          PY
