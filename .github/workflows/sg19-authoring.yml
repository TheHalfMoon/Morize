name: sg19-authoring

on:
  push:
    branches:
      - automation/sg-000019-authoring

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Author and qualify SG-000019 planning branch
        shell: bash
        env:
          PLAN_BRANCH: plan/sg-000019-memory-relation-type
          BASE_MAIN: 85c4493449bba12d1165e3b7667b32f2fd9df532
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          DIFFCIPLINE_PIN: 5cb1c77340b75649f6168e0e8f66479ea047ea96
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          if git ls-remote --exit-code origin "refs/heads/$PLAN_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $PLAN_BRANCH" >&2
            exit 2
          fi

          git switch -C "$PLAN_BRANCH" origin/main
          git config user.name "Gocceri"
          git config user.email "azialshehri@gmail.com"

          python -m pip install --disable-pip-version-check --quiet \
            "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . | tee /tmp/sg19-base-check.json
          specgrain prove --json SG-000011 . | tee /tmp/sg19-sg11-proof.json
          python - <<'PY'
          import json, subprocess
          proof=json.load(open('/tmp/sg19-sg11-proof.json'))
          assert proof['verified'] is True
          assert proof['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          subprocess.run(
              ['git','merge-base','--is-ancestor',
               'b54879d7c04ba914997f14034c3c1b262b9629f6',
               '85c4493449bba12d1165e3b7667b32f2fd9df532'],
              check=True,
          )
          print('SG-000011 prerequisite: PASS')
          PY

          specgrain draft \
            --title "Add baseline memory relation type vocabulary" \
            --outcome "morize-core exposes one dependency-free non-exhaustive MemoryRelationType enum covering the 11 initial relation types already fixed by docs/DATA_MODEL.md, without defining relation endpoints, edge inference class, evidence thresholds, graph traversal, serialization, persistence, or policy behavior." \
            --rationale "P1 requires MemoryRelation, and docs/DATA_MODEL.md already fixes the initial relation vocabulary. This Grain adds only the typed in-memory relation-type vocabulary so later edge-class, relation-structure, evidence, policy, and graph contracts can build on one definition without inventing inference or graph semantics." \
            --parent SG-000010 \
            --json . | tee /tmp/sg19-draft.json

          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.specgrain/specs/SG-000019.json')
          data=json.loads(path.read_text())
          data['metadata'] = {
            'method': {
              'control': 'Implementation is limited to one dependency-free non-exhaustive in-memory MemoryRelationType enum, focused tests, and morize-core re-exports. No MemoryRelation struct, relation endpoints, edge class, inference/evidence thresholds, graph traversal or mutation, authorization, serialization, persistence, or third-party dependency is authorized.',
              'review_separation': 'An independent semantic reviewer must review the exact implementation head, exact initial-relation fidelity, non-exhaustive extensibility, absence of graph/inference/authority semantics, scope containment, and required evidence separately from the implementing agent before acceptance.',
              'rollback': 'Revert the memory-relation-type implementation commits; no persisted format, graph state, inference policy, authorization rule, or user data depends on this Grain.'
            },
            'morize': {
              'proof_prerequisites': [{
                'implementation_revision': 'b54879d7c04ba914997f14034c3c1b262b9629f6',
                'record_digest': 'sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9',
                'spec_id': 'SG-000011',
                'spec_revision': 'sha256:0c609888d253ab94487f9e1bdd2e5370f991321d57269f0b237d778ac30f129d'
              }]
            }
          }
          path.write_text(json.dumps(data,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

          git add .specgrain/specs/SG-000010.json .specgrain/specs/SG-000019.json
          git diff --cached --check
          git commit -s -m "specgrain: draft memory relation type Grain"

          specgrain shape SG-000019 \
            --scope-in "Define public non-exhaustive MemoryRelationType with exactly the 11 initial relation types fixed by docs/DATA_MODEL.md: Supports, Contradicts, Supersedes, DerivedFrom, DependsOn, CausedBy, LedTo, MemberOf, About, RelatedTo, and SourceOf." \
            --scope-in "Keep every current relation type fieldless and derive only Clone, Copy, Debug, PartialEq, Eq, and Hash so the vocabulary is typed without defining ordering, endpoints, edge class, evidence sufficiency, graph, authority, textual/numeric encoding, transport, or persistence semantics." \
            --scope-in "Treat every MemoryRelationType value as descriptive classification only; no variant, including Contradicts, Supersedes, or DerivedFrom, itself establishes truth, authority, inferred-vs-explicit status, evidence sufficiency, graph mutation, or memory mutation." \
            --scope-in "Add standard-library-only focused tests that exercise all 11 current relation types, prove they are distinct hashable values, and prove Copy behavior without textual or numeric encoding." \
            --scope-out "A MemoryRelation struct, RelationId composition, from_ref/to_ref endpoints, explicit/inferred edge class, evidence references, engine identity, confidence, policy revision binding, or inference/evidence thresholds." \
            --scope-out "Graph traversal or mutation, conflict detection, duplicate/update/supersession policy, temporal semantics, authorization, source authority, or any behavior inferred merely from a relation-type value." \
            --scope-out "Display/FromStr, parsers, serde or other serialization integration, numeric repr/discriminants, persisted or wire encoding, configuration formats, migrations, storage, retrieval, or domain-record integration." \
            --scope-out "Any third-party runtime, build, or test dependency." \
            --acceptance "morize-core exports MemoryRelationType from one new relation module with exactly Supports, Contradicts, Supersedes, DerivedFrom, DependsOn, CausedBy, LedTo, MemberOf, About, RelatedTo, and SourceOf as the current baseline variants." \
            --acceptance "MemoryRelationType is marked non_exhaustive because docs/DATA_MODEL.md calls these the initial relation vocabulary; the current implementation adds no twelfth relation type." \
            --acceptance "Every current MemoryRelationType variant is fieldless, and no relation-type value defines endpoints, explicit/inferred edge class, evidence sufficiency, truth, authority, graph mutation, or memory mutation." \
            --acceptance "MemoryRelationType supports Clone, Copy, Debug, PartialEq, Eq, and Hash; focused tests exercise all 11 variants and confirm distinct value semantics without defining an ordering contract." \
            --acceptance "The implementation defines no MemoryRelation struct, relation endpoints, edge class, evidence or inference thresholds, graph traversal/mutation, authorization behavior, Display, FromStr, parser, serde integration, numeric repr/discriminants, or wire/persistence format." \
            --acceptance "cargo fmt --all -- --check passes on the exact implementation head." \
            --acceptance "cargo check --workspace --all-targets --offline passes on the exact implementation head." \
            --acceptance "cargo clippy --workspace --all-targets --offline -- -D warnings passes on the exact implementation head." \
            --acceptance "cargo test --workspace --all-targets --offline passes and includes focused tests for all 11 memory relation types and required value semantics." \
            --acceptance "Cargo manifests and Cargo.lock are unchanged; the Grain admits no runtime, build, or test dependency." \
            --acceptance "GitHub Actions passes Ubuntu, macOS, and Windows on the exact implementation head before acceptance." \
            --acceptance "An independent semantic reviewer reviews the exact implementation head for exact initial-relation fidelity, non-exhaustive extensibility, absence of endpoint/edge-class/inference/authority/graph/wire semantics, scope containment, and required evidence." \
            --acceptance "ADR-0004 proof prerequisite for SG-000011 revalidates against the exact WorkPacket baseline before execution." \
            --acceptance "The implementation changes no path outside crates/morize-core/src/relation.rs and crates/morize-core/src/lib.rs." \
            --risk-level medium \
            --recovery "Revert the memory-relation-type implementation commits; no persisted format, graph state, inference policy, authorization rule, or user data has been written by this Grain." \
            --context-budget 12000 \
            --context-estimate 6800 \
            --change-surface "crates/morize-core/src/relation.rs" \
            --change-surface "crates/morize-core/src/lib.rs" \
            --evidence rollback \
            --evidence independent-review \
            --evidence E-PROOF-PREREQUISITE-SG000011 \
            --evidence E-RELATION-BASELINE-VOCABULARY \
            --evidence E-RELATION-NONEXHAUSTIVE \
            --evidence E-RELATION-FIELDLESS \
            --evidence E-RELATION-NO-GRAPH-SEMANTICS \
            --evidence E-RELATION-VALUE-SEMANTICS \
            --evidence E-RELATION-NO-DEPENDENCIES \
            --evidence E-RUST-FMT \
            --evidence E-RUST-CHECK-OFFLINE \
            --evidence E-RUST-CLIPPY-OFFLINE \
            --evidence E-RUST-TEST-OFFLINE \
            --evidence E-CROSS-PLATFORM-CI \
            --minimality-choice native \
            --minimality-rationale "A single standard-library-only non-exhaustive enum inside existing morize-core is the narrowest implementation of the already-documented initial relation vocabulary. It preserves future extension while deferring endpoints, edge class, inference policy, graph behavior, serialization, and persistence." \
            --safety-status requirements-defined \
            --safety-requirement "MemoryRelationType values are descriptive classification only in this Grain; no variant, including Contradicts, Supersedes, or DerivedFrom, may itself establish authority, inferred truth, evidence sufficiency, graph mutation, or memory mutation." \
            --json . | tee /tmp/sg19-shape.json

          git add .specgrain/specs/SG-000019.json
          git diff --cached --check
          git commit -s -m "specgrain: shape memory relation type contract"

          specgrain refine SG-000019 --json . | tee /tmp/sg19-refine.json
          git add .specgrain/specs/SG-000019.json
          git diff --cached --check
          git commit -s -m "specgrain: refine memory relation type Grain"

          specgrain grain SG-000019 --json . | tee /tmp/sg19-grain.json
          rm -rf .specgrain/tmp
          git add .specgrain/specs/SG-000019.json
          git diff --cached --check
          git commit -s -m "specgrain: promote memory relation type contract to Grain"

          PLAN_HEAD="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          specgrain check --json . | tee /tmp/sg19-check.json
          specgrain next --json . | tee /tmp/sg19-next.json

          python - <<'PY'
          import json
          check=json.load(open('/tmp/sg19-check.json'))
          nxt=json.load(open('/tmp/sg19-next.json'))
          assert check['valid'] is True and check['issues']==[]
          assert 'SG-000019' in nxt['eligible']
          print('SpecGrain final qualification: PASS')
          PY

          SPEC_REVISION="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/sg19-grain.json'))['revision_digest'])
          PY
          )"
          DIFF_SHA256="$(git diff "$BASE_MAIN...$PLAN_HEAD" | sha256sum | awk '{print $1}')"
          FILE_LIST_SHA256="$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sha256sum | awk '{print $1}')"
          test "$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sort | tr '\n' ' ')" = ".specgrain/specs/SG-000010.json .specgrain/specs/SG-000019.json "

          git clone --quiet "https://github.com/TheHalfMoon/Diffcipline.git" /tmp/diffcipline
          git -C /tmp/diffcipline checkout --quiet "$DIFFCIPLINE_PIN"
          cargo run --quiet --locked \
            --manifest-path /tmp/diffcipline/crates/diffcipline-cli/Cargo.toml -- \
            check --base "$BASE_MAIN" --risk R2 --run --json \
            > /tmp/sg19-plan-diffcipline.json 2>/tmp/sg19-plan-diffcipline.err
          DIFFCIPLINE_SHA256="$(sha256sum /tmp/sg19-plan-diffcipline.json | awk '{print $1}')"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/sg19-plan-diffcipline.json'))
          assert x['verdict']=='PASS'
          assert x['changed_files']==2
          assert x['scope_violations']==[]
          assert all(v['state']=='PASS' for v in x['verification'])
          print('Diffcipline exact-head: PASS')
          PY

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          node /tmp/ocr/bin/ocr.js delegate preview --format json --from "$BASE_MAIN" --to "$PLAN_HEAD" \
            > /tmp/sg19-plan-ocr-preview.json
          python - <<'PY'
          import json,subprocess
          x=json.load(open('/tmp/sg19-plan-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=[f['path'] for f in x['reviewable_files']]
          assert sorted(paths)==['.specgrain/specs/SG-000010.json','.specgrain/specs/SG-000019.json']
          with open('/tmp/sg19-plan-ocr-rules.json','w') as out:
              subprocess.run(
                ['node','/tmp/ocr/bin/ocr.js','delegate','rule','--format','json',*paths],
                check=True, stdout=out
              )
          groups=json.load(open('/tmp/sg19-plan-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==sorted(paths)
          print('Alibaba accounting: 2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"
          export PLAN_HEAD SPEC_REVISION DIFF_SHA256 FILE_LIST_SHA256 DIFFCIPLINE_SHA256 BASE_MAIN
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from gradio_client import Client
          spec=Path('.specgrain/specs/SG-000019.json').read_text()
          head=os.environ['PLAN_HEAD']; base=os.environ['BASE_MAIN']
          prompt=f"""Independent semantic PLANNING review of Morize SG-000019. Return final structured review only; do not expose chain-of-thought or tool traces.
          
          REVIEW_HEAD={head}
          BASE_MAIN={base}
          SPEC_REVISION={os.environ['SPEC_REVISION']}
          DIFF_SHA256={os.environ['DIFF_SHA256']}
          FILE_LIST_SHA256={os.environ['FILE_LIST_SHA256']}
          DIFFCIPLINE_SHA256={os.environ['DIFFCIPLINE_SHA256']}
          Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.
          Exact changed paths: .specgrain/specs/SG-000010.json and .specgrain/specs/SG-000019.json.
          SpecGrain check valid=true issues=[]; SG-000019 eligible=true.
          SG-000011 prerequisite: verified=true, record=sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9, implementation b54879d7c04ba914997f14034c3c1b262b9629f6 is ancestor of BASE_MAIN.
          
          Repository planning authority:
          - docs/DATA_MODEL.md calls these the initial MemoryRelation vocabulary: SUPPORTS, CONTRADICTS, SUPERSEDES, DERIVED_FROM, DEPENDS_ON, CAUSED_BY, LED_TO, MEMBER_OF, ABOUT, RELATED_TO, SOURCE_OF.
          - MZ-PROV-005 says inferred graph relationships must identify their inference/evidence class, but SG-000019 intentionally does NOT define edge class or inferred behavior; those require a separate Grain.
          - P1 requires MemoryRelation.
          - This Grain is vocabulary only.
          
          Review goals:
          1. Exact 11 initial relation types and no extra current type.
          2. non_exhaustive is appropriate because the repository calls the vocabulary initial.
          3. Every current variant fieldless and descriptive only.
          4. No relation endpoints, edge class explicit/inferred, evidence thresholds, graph traversal/mutation, conflict/supersession policy, truth/authority, authorization, serialization, persistence, or wire semantics are invented.
          5. Derives limited to Clone, Copy, Debug, PartialEq, Eq, Hash; no ordering.
          6. Exact two-file planning scope, controlled metadata, rollback, SG-000011 prerequisite, and acceptance/evidence coherence.
          7. No third-party implementation dependency.
          
          SG-000019 Grain:
          {spec}
          
          Return exactly:
          REVIEW_HEAD
          {head}
          REVIEW_KIND
          SG-000019_PLANNING
          CRITICAL = NONE
          HIGH = NONE
          MEDIUM = NONE
          LOW = NONE
          FINDINGS
          - NONE
          FINAL_GATE = PASS
          Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.
          """
          Path('/tmp/sg19-plan-north-prompt.txt').write_text(prompt)
          raw=Client('CohereLabs/North-Mini-Code-1.0',verbose=False).predict(
              prompt,'Rust','[]','{}',api_name='/chat'
          )
          obj=json.loads(raw) if isinstance(raw,str) else raw
          content=''
          for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
              if msg.get('role')=='assistant':
                  content=msg.get('content','')
          final=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
          checks=[
              f'REVIEW_HEAD\n{head}',
              'REVIEW_KIND\nSG-000019_PLANNING',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              print(final)
              raise SystemExit('independent semantic review did not qualify')
          Path('/tmp/sg19-plan-north-final.md').write_text(final+'\n')
          summary={
              'base_main':base,
              'planning_head':head,
              'spec_revision':os.environ['SPEC_REVISION'],
              'diff_sha256':os.environ['DIFF_SHA256'],
              'file_list_sha256':os.environ['FILE_LIST_SHA256'],
              'diffcipline_sha256':os.environ['DIFFCIPLINE_SHA256'],
              'review_prompt_sha256':hashlib.sha256(prompt.encode()).hexdigest(),
              'review_final_sha256':hashlib.sha256((final+'\n').encode()).hexdigest(),
          }
          Path('/tmp/sg19-authoring-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

          git push origin "HEAD:refs/heads/$PLAN_BRANCH"

          {
            echo "## SG-000019 authoring qualification"
            echo
            cat /tmp/sg19-authoring-summary.json
            echo
            echo "SpecGrain: PASS"
            echo "Diffcipline: PASS"
            echo "Alibaba accounting: 2/2"
            echo "Independent semantic planning review: PASS"
            echo "Pushed clean branch: $PLAN_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
