name: sg25-workpacket

on:
  push:
    branches:
      - automation/sg-000025-workpacket

permissions:
  contents: read

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build exact SG-000025 WorkPacket
        shell: bash
        env:
          BASE_MAIN: 788bc7129ce815bc31888be58ebc95408eeb7ea1
          SPEC_REVISION: sha256:26514df5919182465e4eb163e774bdddfe556bec116856ba05215e8add7f35e6
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git checkout --detach "$BASE_MAIN"

          python -m pip install --disable-pip-version-check --quiet \
            "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/check.json
          specgrain prove --json SG-000011 . > /tmp/p11.json

          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from specgrain import load_project

          base=os.environ['BASE_MAIN']
          check=json.load(open('/tmp/check.json'))
          assert check['valid'] is True and check['issues']==[]

          project=load_project('.')
          node=next(n for n in project.specs if n.id=='SG-000025')
          assert node.state=='GRAIN'
          assert node.revision_digest==os.environ['SPEC_REVISION']

          p=json.load(open('/tmp/p11.json'))
          assert p['verified'] is True
          assert p['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          latest=p['records'][-1]['report']
          assert latest['spec_revision']=='sha256:0c609888d253ab94487f9e1bdd2e5370f991321d57269f0b237d778ac30f129d'
          assert latest['implementation_revision']=='b54879d7c04ba914997f14034c3c1b262b9629f6'
          assert latest['issues']==[]
          subprocess.run(['git','merge-base','--is-ancestor',latest['implementation_revision'],base],check=True)

          def full(path):
              return subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'{base}:{path}'],text=True).strip()
          def proof_summary(path):
              raw=json.loads(full(path))
              report=raw['report']
              return json.dumps({
                  'record_digest':raw['record_digest'],
                  'verified':report['verified'],
                  'spec_id':report['spec_id'],
                  'spec_revision':report['spec_revision'],
                  'implementation_revision':report['implementation_revision'],
                  'issues':report['issues'],
              },sort_keys=True,separators=(',',':'))

          arch=full('docs/ARCHITECTURE.md')
          a=arch.index('### 3.1 Memory Vault')
          b=arch.index('### 3.2 Operational store',a)
          arch_excerpt=arch[a:b]

          dm=full('docs/DATA_MODEL.md')
          a=dm.index('## 3. Content identity')
          b=dm.index('## 4. Principal',a)
          data_excerpt=dm[a:b]

          roadmap=full('docs/roadmap/FOUNDATION_CORE.md')
          a=roadmap.index('## P1 — Rust deterministic kernel')
          b=roadmap.index('## P2',a)
          p1_excerpt=roadmap[a:b]

          proof_path='.specgrain/evidence/SG-000011/1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9.json'
          selections=[
              ('sg25-grain','.specgrain/specs/SG-000025.json',full('.specgrain/specs/SG-000025.json'),'Exact SG-000025 GRAIN contract, acceptance criteria, scope, proof prerequisite, and evidence requirements.',100),
              ('proof-policy','docs/adr/0004-verified-proof-prerequisites.md',full('docs/adr/0004-verified-proof-prerequisites.md'),'Canonical proof-prerequisite policy governing implementation authorization.',95),
              ('sg11-proof',proof_path,proof_summary(proof_path),'Exact canonical SG-000011 proof identity fields.',95),
              ('sha256-architecture','docs/ARCHITECTURE.md',arch_excerpt,'Canonical architecture excerpt fixing the v1 blob namespace as blobs/sha256.',90),
              ('content-identity-model','docs/DATA_MODEL.md',data_excerpt,'Canonical data-model rule that exact content identity uses a cryptographic digest over canonical bytes.',90),
              ('p1-roadmap','docs/roadmap/FOUNDATION_CORE.md',p1_excerpt,'P1 requirement for stable content digests and deterministic-kernel constraints.',85),
              ('core-export-baseline','crates/morize-core/src/lib.rs',full('crates/morize-core/src/lib.rs'),'Exact pre-execution public export baseline for the only existing file authorized to change.',80),
          ]

          records=[]
          for source_id,path,data,reason,priority in selections:
              encoded=data.encode()
              records.append({
                  'source_id':source_id,
                  'provenance':f'git:{base}:{path}',
                  'selection_reason':reason,
                  'revision':f'git:{blob(path)}',
                  'size_bytes':len(encoded),
                  'token_cost':(len(encoded)+3)//4,
                  'requirement':'required',
                  'priority':priority,
              })
          total=sum(r['token_cost'] for r in records)
          assert total <= 12000, total
          Path('/tmp/sg25-context-sources.json').write_text(json.dumps(records,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print('SPEC_CHECK=PASS')
          print('SG000011_PREREQUISITE=PASS')
          print('CONTEXT_SOURCE_COUNT='+str(len(records)))
          print('CONTEXT_TOKEN_TOTAL='+str(total))
          PY

          specgrain packet SG-000025 . \
            --context-sources /tmp/sg25-context-sources.json \
            --json > /tmp/sg25-workpacket.json

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          p=json.load(open('/tmp/sg25-workpacket.json'))
          assert p['spec_id']=='SG-000025'
          assert p['spec_revision']==os.environ['SPEC_REVISION']
          assert len(p['context_sources'])==7
          print('WORKPACKET_DIGEST='+p['packet_digest'])
          print('WORKPACKET_FILE_SHA256='+hashlib.sha256(Path('/tmp/sg25-workpacket.json').read_bytes()).hexdigest())
          PY

          test -z "$(git status --porcelain)"
