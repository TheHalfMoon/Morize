name: sg25-planning-review

on:
  push:
    branches:
      - automation/sg-000025-planning-review

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Qualify SG-000025 planning head
        shell: bash
        env:
          BASE_MAIN: 39a5c0d157db948519a8bf2f8101a91662eee679
          PLAN_HEAD: cf0a1ebcef1282a1774664ba8201ff706087a1a8
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          OCR_PIN: 85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        run: |
          set -euo pipefail

          git fetch origin main plan/sg-000025-sha256-digest-value --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/plan/sg-000025-sha256-digest-value)" = "$PLAN_HEAD"
          git checkout --detach "$PLAN_HEAD"
          test "$(git rev-parse HEAD)" = "$PLAN_HEAD"

          python -m pip install --disable-pip-version-check --quiet \
            "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/sg25-check.json
          specgrain prove --json SG-000011 . > /tmp/p11.json

          python - <<'PY'
          import json, os, subprocess
          from specgrain import load_project

          check=json.load(open('/tmp/sg25-check.json'))
          assert check['valid'] is True and check['issues']==[]

          project=load_project('.')
          node=next(n for n in project.specs if n.id=='SG-000025')
          assert node.state=='GRAIN'
          assert node.parent_id=='SG-000010'
          assert tuple(sorted(node.change_surface))==tuple(sorted([
              'crates/morize-core/src/digest.rs',
              'crates/morize-core/src/lib.rs',
          ]))
          assert len(node.acceptance)==20
          assert len(node.evidence['required'])==16

          p=json.load(open('/tmp/p11.json'))
          assert p['verified'] is True
          assert p['latest_record_digest']=='sha256:1239df705eb00068720cd5c765f2566bb7a8519afe638a1ded4ddc3eee4e70b9'
          latest=p['records'][-1]['report']
          assert latest['spec_revision']=='sha256:0c609888d253ab94487f9e1bdd2e5370f991321d57269f0b237d778ac30f129d'
          assert latest['implementation_revision']=='b54879d7c04ba914997f14034c3c1b262b9629f6'
          assert latest['issues']==[]
          subprocess.run(
              ['git','merge-base','--is-ancestor',latest['implementation_revision'],os.environ['BASE_MAIN']],
              check=True,
          )

          program=next(n for n in project.specs if n.id=='SG-000010')
          assert program.state=='DRAFT'
          assert 'SG-000025' in program.children

          print('SPEC_CHECK=PASS')
          print('SG000025_SPEC_REVISION='+node.revision_digest)
          print('PROOF_PREREQUISITE_SG000011=PASS')
          print('PROGRAM_STATE_PRESERVED=DRAFT')
          PY

          test "$(git diff --name-only "$BASE_MAIN...$PLAN_HEAD" | sort | tr '\n' ' ')" = ".specgrain/specs/SG-000010.json .specgrain/specs/SG-000025.json "
          echo "PLANNING_SCOPE=PASS"

          git clone --quiet "https://github.com/alibaba/open-code-review.git" /tmp/ocr
          git -C /tmp/ocr checkout --quiet "$OCR_PIN"
          (cd /tmp/ocr && GOTOOLCHAIN=auto go build -o /tmp/ocr-bin ./cmd/opencodereview)
          OCR_NO_UPDATE=1 /tmp/ocr-bin delegate preview --format json --from "$BASE_MAIN" --to "$PLAN_HEAD" > /tmp/sg25-ocr-preview.json

          python - <<'PY'
          import json, subprocess
          x=json.load(open('/tmp/sg25-ocr-preview.json'))
          assert x['total_files']==2
          assert x['reviewable_count']==2
          assert x['excluded_count']==0
          paths=sorted(f['path'] for f in x['reviewable_files'])
          assert paths==['.specgrain/specs/SG-000010.json','.specgrain/specs/SG-000025.json']
          with open('/tmp/sg25-ocr-rules.json','w') as out:
              subprocess.run(['/tmp/ocr-bin','delegate','rule','--format','json',*paths],check=True,stdout=out)
          groups=json.load(open('/tmp/sg25-ocr-rules.json'))['groups']
          accounted=sorted(p for g in groups for p in g['files'])
          assert accounted==paths
          print('ALIBABA_ACCOUNTING=2/2')
          PY

          python -m pip install --disable-pip-version-check --quiet "gradio_client>=1.8,<2"

          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from gradio_client import Client
          from specgrain import load_project

          node=next(n for n in load_project('.').specs if n.id=='SG-000025')
          spec=Path('.specgrain/specs/SG-000025.json').read_text()
          architecture=Path('docs/ARCHITECTURE.md').read_text()
          data_model=Path('docs/DATA_MODEL.md').read_text()
          roadmap=Path('docs/roadmap/FOUNDATION_CORE.md').read_text()

          architecture_excerpt=architecture[architecture.index('### 3.1 Memory Vault'):architecture.index('### 3.2 Operational store')]
          data_excerpt=data_model[data_model.index('## 3. Content identity'):data_model.index('## 4. Principal')]
          p1_excerpt=roadmap[roadmap.index('## P1 — Rust deterministic kernel'):roadmap.index('## P2')]

          prompt='\n'.join([
              'Independent semantic PLANNING review of Morize SG-000025. Return final structured review only; do not expose chain-of-thought or tool traces.',
              '',
              f'REVIEW_HEAD={os.environ["PLAN_HEAD"]}',
              f'BASE_MAIN={os.environ["BASE_MAIN"]}',
              f'SPEC_REVISION={node.revision_digest}',
              'Alibaba accounting only: total=2 reviewable=2 excluded=0 rule-accounted=2/2.',
              'Exact planning diff: SG-000010 child registration plus SG-000025 only.',
              '',
              'Review goals:',
              '1. SHA-256 is supported by repository authority: architecture uses blobs/sha256 and the data model requires cryptographic content digests over canonical bytes.',
              '2. This Grain defines only an algorithm-specific 32-byte value and strict lowercase 64-character canonical text representation; it does not compute SHA-256.',
              '3. from_bytes must not imply the bytes were produced by SHA-256, and digest equality must not imply authority, trust, authenticity, or operation identity.',
              '4. Parser behavior is fail-closed: exact 64-byte length, lowercase hex only, exact first offending index/byte, no normalization or truncation.',
              '5. Debug and parse errors do not disclose digest bytes or source text.',
              '6. No canonical-content encoder, blob path/storage, evidence-chain, idempotency, serialization, persistence, API, MCP, retrieval, domain-record integration, or dependency is authorized.',
              '7. The exact implementation surface is digest.rs plus lib.rs only.',
              '8. SG-000011 proof-prerequisite identity is exact and broad SG-000010 remains DRAFT.',
              '9. Acceptance/evidence are sufficient for exact-head cross-platform proof and independent implementation review.',
              '',
              'SG-000025:',
              spec,
              '',
              'Architecture SHA-256 excerpt:',
              architecture_excerpt,
              '',
              'Data-model content identity excerpt:',
              data_excerpt,
              '',
              'P1 roadmap excerpt:',
              p1_excerpt,
              '',
              'Return exactly:',
              'REVIEW_HEAD',
              os.environ['PLAN_HEAD'],
              'REVIEW_KIND',
              'SG-000025_PLANNING',
              'CRITICAL = NONE',
              'HIGH = NONE',
              'MEDIUM = NONE',
              'LOW = NONE',
              'FINDINGS',
              '- NONE',
              'FINAL_GATE = PASS',
              'Replace NONE/PASS only when concise material findings require it. Any different REVIEW_HEAD invalidates the review.'
          ])

          client=Client('CohereLabs/North-Mini-Code-1.0',verbose=False)
          final=''
          for attempt in range(1,4):
              raw=client.predict(prompt,'Rust','[]','{}',api_name='/chat')
              obj=json.loads(raw) if isinstance(raw,str) else raw
              content=''
              for msg in obj.get('history',[]) if isinstance(obj,dict) else []:
                  if msg.get('role')=='assistant':
                      content=msg.get('content','')
              candidate=content.split('</think>',1)[-1].strip() if '</think>' in content else content.strip()
              structured=(f'REVIEW_HEAD\n{os.environ["PLAN_HEAD"]}' in candidate and 'REVIEW_KIND\nSG-000025_PLANNING' in candidate)
              if structured:
                  final=candidate
                  break
              print(f'REVIEW_PROVIDER_ATTEMPT_{attempt}=INVALID_NONSTRUCTURED')
              print(candidate[:500])
              if attempt<3:
                  time.sleep(10)
          if not final:
              raise SystemExit('independent planning reviewer returned no structured review')

          print('INDEPENDENT_REVIEW_BEGIN')
          print(final)
          print('INDEPENDENT_REVIEW_END')
          checks=[
              f'REVIEW_HEAD\n{os.environ["PLAN_HEAD"]}',
              'REVIEW_KIND\nSG-000025_PLANNING',
              'CRITICAL = NONE','HIGH = NONE','MEDIUM = NONE','LOW = NONE',
              'FINDINGS\n- NONE','FINAL_GATE = PASS'
          ]
          if not all(x in final for x in checks):
              raise SystemExit('independent planning review produced a non-PASS result')

          print('REVIEW_PROMPT_SHA256='+hashlib.sha256(prompt.encode()).hexdigest())
          print('REVIEW_FINAL_SHA256='+hashlib.sha256((final+'\n').encode()).hexdigest())
          PY
