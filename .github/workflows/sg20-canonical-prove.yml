name: sg20-canonical-prove

on:
  push:
    branches:
      - automation/sg-000020-canonical-prove

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prove canonical SG-000020 and inspect next frontier
        shell: bash
        env:
          CANONICAL_MAIN: f79e1bd91aa39760d283eb326a17a0ea08e0eeba
          SPEC_GRAIN_PIN: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
          EXPECTED_RECORD: sha256:0980253c079ec58609e40d76e35ec42a3f10d3a6a5570d045c04aff19e95fa7d
        run: |
          set -euo pipefail

          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$CANONICAL_MAIN"
          git checkout --detach "$CANONICAL_MAIN"

          python -m pip install --disable-pip-version-check --quiet             "git+https://github.com/TheHalfMoon/SpecGrain.git@$SPEC_GRAIN_PIN"

          specgrain check --json . > /tmp/check.json
          specgrain prove --json SG-000020 . > /tmp/prove.json
          specgrain next --json . > /tmp/next.json

          python - <<'PY'
          import json, os

          check=json.load(open('/tmp/check.json'))
          prove=json.load(open('/tmp/prove.json'))
          nxt=json.load(open('/tmp/next.json'))

          assert check['valid'] is True
          assert check['issues'] == []
          assert prove['verified'] is True
          assert prove['latest_record_digest'] == os.environ['EXPECTED_RECORD']
          assert prove['record_count'] == 1

          print('CANONICAL_MAIN='+os.environ['CANONICAL_MAIN'])
          print('SPEC_CHECK_VALID=true')
          print('SG000020_VERIFIED=true')
          print('SG000020_RECORD_COUNT=1')
          print('SG000020_RECORD_DIGEST='+prove['latest_record_digest'])
          print('SG000020_STATE='+prove.get('state','UNKNOWN'))
          print('NEXT_JSON='+json.dumps(nxt,sort_keys=True,separators=(',',':')))
          PY
